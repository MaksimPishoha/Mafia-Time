<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Time · Профіль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E1014; --card: #181B22; --line: #22262F; --line2: #1F232B; --chip: #2A2F3A;
  --text: #ECE7DC; --muted: #8D8778; --soft: #B7AE9C; --gold: #E2BE6A; --gold2: #F3D58E;
  --green: #7FC9A0; --red: #C0453A; --ink: #17130A;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Manrope, system-ui, sans-serif; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; }
.wrap { max-width: 480px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line2); min-height: 56px; }
.top h2 { margin: 0; font-size: 15px; font-weight: 700; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #9AA0AA; cursor: pointer; border-radius: 12px; }
.hero { display: flex; flex-direction: column; align-items: center; padding: 22px 16px 16px; gap: 6px; text-align: center; }
.ava-wrap { position: relative; margin-bottom: 8px; }
.ava { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ava-in { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); background: var(--chip); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; }
.ava-in { position: relative; overflow: hidden; }
.ava-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.lvl-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 2px solid var(--bg); }
h1 { margin: 6px 0 0; font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1.15; word-break: break-word; }
.sub { font-size: 13px; color: var(--soft); }
.tokens { display: flex; gap: 8px; margin-top: 6px; }
.token { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.token.rare { border-color: var(--gold); }
.xp { width: 100%; padding: 0 16px; margin-top: 4px; }
.bar { height: 8px; border-radius: 999px; background: var(--line2); overflow: hidden; }
.bar > div { height: 100%; background: var(--gold); border-radius: 999px; }
.xp-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
.actions { display: flex; gap: 8px; padding: 14px 16px 4px; }
.btn { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn:disabled { background: var(--line); color: var(--muted); border-color: var(--line); cursor: default; }
.tabs { display: flex; gap: 4px; margin: 14px 16px 0; padding: 4px; background: var(--card); border-radius: 14px; border: 1px solid var(--line); }
.tab { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; }
.tabs.four .tab { font-size: 12px; }
.split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line2); margin-top: 10px; gap: 2px; }
.split > div { height: 100%; }
.tab.on { background: var(--chip); color: var(--text); }
.section { padding: 14px 16px; }
.label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 4px 0 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 800; }
.stat span { font-size: 11px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.ach { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
.ach.rare { border-color: var(--gold); }
.ach.locked { opacity: .45; }
.ach .e { font-size: 26px; line-height: 1.1; }
.ach .n { font-size: 12px; font-weight: 700; line-height: 1.2; }
.ach .d { font-size: 10px; color: var(--muted); line-height: 1.25; }
.ach .s { font-size: 11px; font-weight: 800; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 32px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 0; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.chip.on { background: var(--chip); color: var(--text); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.li:first-child { border-top: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
.lock-note { margin: 4px 16px 20px; padding: 12px 14px; border-radius: 12px; border: 1px dashed #2E333D; display: flex; gap: 10px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.frame-btn { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.frame-btn.sel { border-color: var(--gold); }
.frame-btn.locked { opacity: .55; }
.frame-btn .n { font-size: 11px; font-weight: 700; line-height: 1.2; }
.frame-btn .t { font-size: 10px; }
.rank { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; }
.rank.me { background: #1F1B12; border-color: var(--gold); color: var(--gold); }
.rank .l { width: 52px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.demo { margin: 10px 16px 0; padding: 8px 12px; border-radius: 10px; background: #1F1B12; color: var(--gold); font-size: 12px; text-align: center; }
.bottom { position: sticky; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line2); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- Правила гри для вікна. Генеруються з mafia_time/progress.py командою: python webapp/build.py -->
<script id="rules" type="application/json">
/*RULES*/{"levelStep": 250, "xp": {"play": 20, "win": 30, "survive": 10, "feat": 5, "featCap": 25}, "ranks": [[1, "Новачок"], [5, "Мешканець"], [10, "Детектив"], [20, "Інспектор"], [30, "Хрещений батько"], [50, "Легенда міста"]], "levelRewards": [[5, 100], [10, 150], [15, 200], [20, 300], [30, 500], [50, 1000]], "achievements": [["first_game", "🎲", "Перша ніч", "Зіграй першу гру", 1, 50, 0, 0], ["games_50", "🗓", "Завсідник", "Зіграй 50 ігор", 50, 150, 0, 0], ["wins_10", "🏅", "Смак перемоги", "Виграй 10 ігор", 10, 100, 0, 0], ["wins_100", "🎯", "Сотня", "Виграй 100 ігор", 100, 300, 1, 0], ["streak_5", "🔥", "На хвилі", "Виграй 5 ігор поспіль", 5, 150, 0, 0], ["nights_10", "🌙", "Нічний вовк", "Доживи до 10-го дня в одній грі", 1, 100, 0, 0], ["civ_wins", "👨🏼", "Голос народу", "Виграй 10 разів Мирним жителем", 10, 100, 0, 0], ["found_50", "🕵🏼", "Гроза мафії", "Знайди 50 мафіозі перевірками", 50, 300, 1, 0], ["saved_25", "💉", "Ангел-охоронець", "Врятуй 25 гравців Лікарем", 25, 200, 0, 0], ["don_20", "🤵🏻", "Хрещений батько", "Виграй 20 разів Доном", 20, 300, 1, 0], ["charmed_10", "💃🏼", "Серцеїдка", "Відволічи 10 гравців Коханкою", 10, 100, 0, 0], ["maniac_5", "🔪", "Тінь міста", "Виграй 5 разів Маньяком", 5, 200, 0, 0], ["suicide", "🤦🏼‍♂️", "Мрія збулася", "Добийся страти Самогубцем", 1, 100, 0, 0], ["kamikaze", "💣", "Не сам", "Забери когось із собою Камікадзе", 1, 100, 0, 1], ["lucky", "🤞", "Народжений у сорочці", "Переживи замах Щасливчиком", 1, 100, 0, 1]], "frames": [["none", "Без рамки", "#2A2F3A", 0, "", ""], ["steel", "Сталь", "#9AA0AA", 5, "", ""], ["gold", "Золота зірка", "#E2BE6A", 10, "", ""], ["police", "Поліцейська", "#5B8DEF", 0, "found_50", ""], ["blood", "Кривава ніч", "#C0453A", 0, "don_20", ""], ["angel", "Ангельська", "#EDEAE0", 0, "saved_25", ""], ["double", "Подвійна", "#E2BE6A", 20, "", "#C0453A"], ["hundred", "Сотня", "#7FC9A0", 0, "wins_100", ""], ["legend", "Легенда міста", "#F3D58E", 50, "", "#E2BE6A"]], "roles": {"civilian": ["👨🏼", "Мирний житель"], "don": ["🤵🏻", "Дон"], "mafia": ["🤵🏼", "Мафія"], "commissioner": ["🕵🏼", "Комісар Каттані"], "sergeant": ["👮🏻‍♂️", "Сержант"], "doctor": ["👨🏼‍⚕️", "Лікар"], "maniac": ["🔪", "Маньяк"], "lover": ["💃🏼", "Коханка"], "lawyer": ["👨🏼‍💼", "Адвокат"], "suicide": ["🤦🏼‍♂️", "Самогубець"], "bomj": ["🧙🏼‍♂️", "Бомж"], "lucky": ["🤞", "Щасливчик"], "kamikaze": ["💣", "Камікадзе"]}, "items": [["docs", "📂", "Документи"], ["shields", "🛡", "Захист"], ["ap", "🔫", "Бронебійний патрон"], ["tap", "🎧", "Прослуховування"]]}/*END*/
</script>

<script>
(async function () {
  "use strict";
  var raw = document.getElementById("rules").textContent;
  var R = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
  var tg = window.Telegram && window.Telegram.WebApp;
  var ACH = R.achievements.map(function (a, i) {
    return { i: i, key: a[0], emoji: a[1], name: a[2], desc: a[3], goal: a[4], xp: a[5], rare: !!a[6], secret: !!a[7] };
  });
  var ACH_BY_KEY = {}; ACH.forEach(function (a) { ACH_BY_KEY[a.key] = a; });
  var FRAMES = R.frames.map(function (f) {
    return { key: f[0], name: f[1], color: f[2], level: f[3], ach: f[4], outline: f[5] };
  });

  // ---------- дані профілю з посилання ----------
  // Дані з посилання: base64url від JSON або від стиснутого zlib JSON (перший байт 0x78).
  async function decode(s) {
    if (!s) return null;
    try {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      var bin = atob(s), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      if (bytes[0] === 0x78) {
        if (!window.DecompressionStream) { window.__needUpdate = true; return null; }
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
        return JSON.parse(await new Response(stream).text());
      }
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }
  // Дані можуть прийти: ?p=... (кнопка в особистих), start_param (посилання з групи),
  // або в хеші. Telegram додає до хешу свої параметри (tgWebAppData=...), їх пропускаємо.
  function param(str, key) {
    var parts = (str || "").replace(/^[?#]/, "").split("&");
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (kv[0] === key) return decodeURIComponent(kv.slice(1).join("="));
    }
    return "";
  }
  var startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
    param(location.search, "tgWebAppStartParam") || param(location.hash, "tgWebAppStartParam");
  var D = (await decode(param(location.search, "p"))) || (await decode(startParam)) ||
    (await decode((location.hash.slice(1).split("&")[0] || "").indexOf("=") < 0 ? location.hash.slice(1).split("&")[0] : ""));
  var demo = !D;
  if (demo) {
    D = { u: 1, b: "", n: "Максим", x: 9990, g: 147, w: 81, a: 2, s: 6, f: ["doctor", 31], e: 0b100100010101, r: "gold",
          p: [1, 50, 10, 81, 5, 1, 7, 50, 18, 7, 10, 2, 1, 1, 0], t: [7, 4, 0], m: 1240, i: [2, 1, 0, 3],
          st: { a: [242, 94, 159, 62, 68, 19, 28, 70, [82, 39, 22, 21, 9, 26, 3, 4, 1, 11, 4, 21]],
                c: [150, 55, 91, 40, 41, 11, 24, 45, [48, 22, 17, 15, 5, 13, 2, 4, 1, 9, 4, 7]], cn: "Mafia Time" } };
  }
  var viewerId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
  var own = D.m !== undefined || (viewerId && viewerId === D.u) || demo;
  var earned = function (a) { return (D.e >> a.i) & 1; };
  var earnedCount = ACH.filter(earned).length;

  // ---------- рівні ----------
  function levelOf(xp) {
    var level = 1;
    while (xp >= R.levelStep * level) { xp -= R.levelStep * level; level++; }
    return { level: level, cur: xp, need: R.levelStep * level };
  }
  function rankOf(level) {
    var name = R.ranks[0][1];
    R.ranks.forEach(function (r) { if (level >= r[0]) name = r[1]; });
    return name;
  }
  var L = levelOf(D.x || 0);
  function frameOwned(f) { return f.ach ? !!(ACH_BY_KEY[f.ach] && earned(ACH_BY_KEY[f.ach])) : L.level >= f.level; }
  function frameHow(f) { return f.ach ? "Досягнення «" + (ACH_BY_KEY[f.ach] || {}).name + "»" : (f.level > 1 ? "Рівень " + f.level : "Доступна завжди"); }
  var current = FRAMES.filter(function (f) { return f.key === D.r && frameOwned(f); })[0] || FRAMES[0];

  // ---------- допоміжне ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  var ICON_BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  var ICON_LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  // Аватарка з Telegram: своя з даних запуску, чужа за публічним @ніком. Немає фото: перша літера імені.
  var tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  var PHOTO = (tgUser && tgUser.id === D.u && tgUser.photo_url) ||
    (D.un ? "https://t.me/i/userpic/320/" + encodeURIComponent(D.un) + ".jpg" : "");
  function avatar(f, size, font) {
    var pad = Math.max(3, Math.round(size / 24));
    var outline = f.outline ? "box-shadow:0 0 0 3px " + f.outline + ";" : "";
    var img = PHOTO ? '<img src="' + esc(PHOTO) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : "";
    return '<div class="ava" style="width:' + size + 'px;height:' + size + 'px;padding:' + pad + 'px;background:' + f.color + ';' + outline + '">' +
      '<div class="ava-in" style="font-size:' + font + 'px">' + esc((D.n || "?").trim().charAt(0).toUpperCase()) + img + '</div></div>';
  }
  function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  // ---------- стан ----------
  var state = { view: "main", tab: "overview", filter: "all", pick: current.key, scope: "a" };
  function go(view) { state.view = view; haptic(); render(); window.scrollTo(0, 0); }

  // ---------- екрани ----------
  function mainView() {
    var games = D.g || 0, wins = D.w || 0;
    var rate = games ? Math.round(wins / games * 100) + "%" : "—";
    var tokens = (D.t || []).map(function (i) { var a = ACH[i]; return a ? '<div class="token' + (a.rare ? " rare" : "") + '" title="' + esc(a.name) + '">' + a.emoji + '</div>' : ""; }).join("");
    var h = '<div class="top"><h2 style="padding-left:6px">' + (own ? "Мій профіль" : "Профіль гравця") + '</h2></div>';
    if (demo) h += '<div class="demo">' + (window.__needUpdate ? "Онови Telegram: ця версія не може відкрити дані профілю." : "Демо: так виглядатиме вікно. Справжні дані прийдуть з кнопки в боті.") + '</div>';
    h += '<div class="hero"><div class="ava-wrap">' + avatar(current, 112, 40) + '<div class="lvl-badge">Рів. ' + L.level + '</div></div>' +
      '<h1>' + esc(D.n || "Гравець") + '</h1>' +
      '<div class="sub">' + rankOf(L.level) + (current.key !== "none" ? " · рамка «" + esc(current.name) + "»" : "") + '</div>' +
      (tokens ? '<div class="tokens">' + tokens + '</div>' : "") + '</div>' +
      '<div class="xp"><div class="bar"><div style="width:' + Math.min(100, L.cur / L.need * 100) + '%"></div></div>' +
      '<div class="xp-row"><span>' + num(L.cur) + ' / ' + num(L.need) + ' XP</span><span>до рівня ' + (L.level + 1) + '</span></div></div>';
    h += '<div class="actions">' + (own ? '<button class="btn" data-go="frames">🖼 Рамка</button>' : "") +
      '<button class="btn" data-go="levels">⭐ Рівні</button></div>';
    var tabs = [["overview", "Огляд"], ["ach", "Досягнення"]];
    if (D.st && D.st.a) tabs.push(["stats", "Статистика"]);
    if (D.m !== undefined) tabs.push(["inv", "Інвентар"]);
    h += '<div class="tabs' + (tabs.length > 3 ? " four" : "") + '" role="tablist">' + tabs.map(function (t) {
      return '<button class="tab' + (state.tab === t[0] ? " on" : "") + '" role="tab" aria-selected="' + (state.tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join("") + '</div>';

    if (state.tab === "overview") {
      h += '<div class="section"><div class="grid3">' +
        '<div class="stat"><b>' + num(games) + '</b><span>ігор</span></div>' +
        '<div class="stat"><b>' + rate + '</b><span>перемог</span></div>' +
        '<div class="stat"><b>' + earnedCount + '</b><span>досягнень</span></div></div>';
      h += '<div class="grid2" style="margin-top:8px">' +
        '<div class="stat"><b>' + num(wins) + '</b><span>перемог усього</span></div>' +
        '<div class="stat"><b>' + (D.s || 0) + '</b><span>найкраща серія</span></div></div>';
      if (D.f && R.roles[D.f[0]]) {
        var role = R.roles[D.f[0]];
        h += '<div class="card row" style="margin-top:8px"><div style="font-size:28px">' + role[0] + '</div><div>' +
          '<div class="label" style="margin:0">Улюблена роль</div><div style="font-weight:700;margin-top:2px">' + esc(role[1]) + ' · ' + D.f[1] + ' ' + plural(D.f[1], "гра", "гри", "ігор") + '</div></div></div>';
      }
      var show = ACH.filter(earned).sort(function (a, b) { return b.rare - a.rare; }).slice(0, 3);
      if (show.length) {
        h += '<div class="label" style="margin-top:16px">Вітрина досягнень</div><div class="grid3">' +
          show.map(function (a) { return '<div class="ach' + (a.rare ? " rare" : "") + '"><div class="e">' + a.emoji + '</div><div class="n">' + esc(a.name) + '</div></div>'; }).join("") + '</div>';
      }
      if (D.a) h += '<div class="note">💤 Покинуто ігор: ' + D.a + '</div>';
      h += '</div>';
      if (!own) h += '<div class="lock-note">' + ICON_LOCK + '<div>Інвентар і баланс видно лише власнику профілю.</div></div>';
    } else if (state.tab === "ach") {
      h += achList();
    } else if (state.tab === "stats") {
      h += statsView();
    } else {
      h += '<div class="section"><div class="card row" style="justify-content:space-between"><span style="color:var(--soft)">Баланс</span><b style="font-size:20px">' + num(D.m) + ' 💵</b></div>' +
        '<div class="label" style="margin-top:16px">Предмети</div><div class="list">' +
        R.items.map(function (it, i) { return '<div class="li"><span>' + it[1] + ' ' + esc(it[2]) + '</span><b>×' + ((D.i || [])[i] || 0) + '</b></div>'; }).join("") +
        '</div><div class="note">Купити або відкласти предмети: /shop і /inventory у бота. Інвентар бачиш лише ти.</div></div>';
    }
    return h;
  }

  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  // ---------- статистика ----------
  var ROLE_KEYS = Object.keys(R.roles);
  function pct(part, total) {
    if (!total) return "0%";
    var v = Math.round(part / total * 1000) / 10;
    return String(v).replace(".", ",") + "%";
  }
  function statsView() {
    var scopes = [["a", "Усі чати"]];
    if (D.st.c) scopes.push(["c", D.st.cn || "Цей чат"]);
    if (!D.st[state.scope]) state.scope = "a";
    var s = D.st[state.scope];
    var n = s[0], w = s[1], town = s[2], maf = s[3], killed = s[4], first = s[5], lynched = s[6], alive = s[7], roles = s[8] || [];
    var h = '<div class="section">';
    if (scopes.length > 1) {
      h += '<div class="chips" role="tablist">' + scopes.map(function (sc) {
        return '<button class="chip' + (state.scope === sc[0] ? " on" : "") + '" data-scope="' + sc[0] + '" aria-pressed="' + (state.scope === sc[0]) + '">' + esc(sc[1]) + '</button>';
      }).join("") + '</div>';
    }
    if (!n) return h + '<div class="card" style="color:var(--muted);text-align:center">Ще немає зіграних ігор.</div></div>';
    h += '<div class="grid3">' +
      '<div class="stat"><b>' + num(n) + '</b><span>ігор</span></div>' +
      '<div class="stat"><b style="color:var(--green)">' + num(w) + '</b><span>перемог · ' + pct(w, n) + '</span></div>' +
      '<div class="stat"><b style="color:var(--red)">' + num(n - w) + '</b><span>поразок · ' + pct(n - w, n) + '</span></div></div>';
    h += '<div class="label" style="margin-top:16px">Сторони</div><div class="card">' +
      '<div class="row" style="justify-content:space-between;font-size:14px"><span>👨🏼 За мирних <b>' + town + '</b></span><span>🤵🏻 За мафію <b>' + maf + '</b></span></div>' +
      '<div class="split"><div style="width:' + (n ? town / n * 100 : 0) + '%;background:var(--green)"></div><div style="width:' + (n ? maf / n * 100 : 0) + '%;background:var(--red)"></div></div>' +
      '<div class="xp-row"><span>' + pct(town, n) + '</span><span>' + (n - town - maf > 0 ? "інші " + pct(n - town - maf, n) : "") + '</span><span>' + pct(maf, n) + '</span></div></div>';
    h += '<div class="label" style="margin-top:16px">Як закінчувались ігри</div><div class="list">' +
      [["☠️ Убито вночі", killed], ["🌑 Першої ж ночі", first], ["⚖️ Страчено вдень", lynched], ["❤️ Дожив до кінця", alive]].map(function (r) {
        return '<div class="li"><span>' + r[0] + '</span><span><b>' + r[1] + '</b> <span style="color:var(--muted);font-size:12px">' + pct(r[1], n) + '</span></span></div>';
      }).join("") + '</div>';
    var list = roles.map(function (c, i) { return [ROLE_KEYS[i], c]; }).filter(function (r) { return r[1] > 0 && R.roles[r[0]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    if (list.length) {
      var top = list[0][1];
      h += '<div class="label" style="margin-top:16px">Ролі</div><div class="list">' + list.map(function (r) {
        var role = R.roles[r[0]];
        return '<div class="li" style="display:block"><div class="row" style="justify-content:space-between"><span>' + role[0] + ' ' + esc(role[1]) + '</span>' +
          '<span><b>' + r[1] + '</b> <span style="color:var(--muted);font-size:12px">' + pct(r[1], n) + '</span></span></div>' +
          '<div class="bar" style="height:5px;margin-top:7px"><div style="width:' + (r[1] / top * 100) + '%"></div></div></div>';
      }).join("") + '</div>';
    }
    h += '<div class="note">Тестові ігри з ботами не враховуються. Детальніше в чаті: /stat, /stat_all, /stat_chat.</div></div>';
    return h;
  }

  function achList() {
    var filters = [["all", "Усі"], ["done", "Отримані"], ["rare", "Рідкісні"]];
    var h = '<div class="section"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-family:\'Playfair Display\',serif;font-size:20px">' + earnedCount + ' з ' + ACH.length + '</b></div>' +
      '<div class="bar" style="margin-bottom:14px"><div style="width:' + (earnedCount / ACH.length * 100) + '%"></div></div>' +
      '<div class="chips">' + filters.map(function (f) { return '<button class="chip' + (state.filter === f[0] ? " on" : "") + '" data-filter="' + f[0] + '">' + f[1] + '</button>'; }).join("") + '</div>';
    var list = ACH.filter(function (a) {
      if (state.filter === "done") return earned(a);
      if (state.filter === "rare") return a.rare;
      return true;
    });
    h += '<div class="grid3">' + list.map(function (a) {
      var got = earned(a);
      if (!got && a.secret) return '<div class="ach locked"><div class="e">🔒</div><div class="n">???</div><div class="d">Таємне досягнення</div><div class="s" style="color:var(--muted)">?</div></div>';
      var p = (D.p || [])[a.i] || 0;
      var st = got ? (a.rare ? "Рідкісне ✓" : "✓") : (a.goal > 1 ? p + "/" + a.goal : "—");
      return '<div class="ach' + (got && a.rare ? " rare" : "") + '"' + (got ? "" : ' style="opacity:.75"') + '><div class="e">' + a.emoji + '</div><div class="n">' + esc(a.name) + '</div>' +
        '<div class="d">' + esc(a.desc) + '</div><div class="s" style="color:' + (got ? "var(--green)" : "var(--gold)") + '">' + st + '</div></div>';
    }).join("") + '</div>';
    if (!list.length) h += '<div class="note">Тут поки порожньо.</div>';
    h += '<div class="note">За кожне досягнення дають досвід, а емодзі стає жетоном у профілі. Рідкісні відкривають рамки.</div></div>';
    return h;
  }

  function framesView() {
    var pick = FRAMES.filter(function (f) { return f.key === state.pick; })[0] || current;
    var h = '<div class="top"><button class="icon-btn" data-go="main" aria-label="Назад">' + ICON_BACK + '</button><h2>Рамка профілю</h2></div>' +
      '<div class="hero" style="border-bottom:1px solid var(--line2)">' + avatar(pick, 124, 44) +
      '<h1 style="font-size:20px;margin-top:10px">' + esc(pick.name) + '</h1><div class="sub" style="color:var(--muted);font-size:12px">' + esc(frameHow(pick)) + '</div></div>' +
      '<div class="section"><div class="grid3">' + FRAMES.map(function (f) {
        var ok = frameOwned(f);
        var tag = f.key === current.key ? "Обрана" : (ok ? "Є" : (f.ach ? "Досягнення" : "Рівень " + f.level));
        return '<button class="frame-btn' + (f.key === pick.key ? " sel" : "") + (ok ? "" : " locked") + '" data-pick="' + f.key + '" aria-pressed="' + (f.key === pick.key) + '">' +
          avatar(f, 54, 0) + '<div class="n">' + esc(f.name) + '</div><div class="t" style="color:' + (ok ? "var(--green)" : "var(--muted)") + '">' + tag + '</div></button>';
      }).join("") + '</div></div>';
    var ok = frameOwned(pick);
    var label = pick.key === current.key ? "Уже обрано" : (ok ? "Встановити рамку" : "Ще не відкрито: " + frameHow(pick));
    h += '<div class="bottom"><button class="btn primary" id="apply"' + (ok && pick.key !== current.key ? "" : " disabled") + ' style="width:100%;min-height:50px;font-size:15px">' + esc(label) + '</button>' +
      (D.b ? "" : '<div class="note" style="text-align:center">У демо рамка не зберігається.</div>') + '</div>';
    return h;
  }

  function levelsView() {
    var x = R.xp;
    var src = [["Зіграна гра до кінця", "+" + x.play + " XP"], ["Перемога команди", "+" + x.win + " XP"], ["Дожив до кінця гри", "+" + x.survive + " XP"],
      ["Корисний хід (знайшов мафію, врятував, відволік)", "+" + x.feat + " XP, до +" + x.featCap], ["Нове досягнення", "+50…300 XP"],
      ["Вигнали за неактивність", "0"], ["Тестова гра з ботами", "0"]];
    var h = '<div class="top"><button class="icon-btn" data-go="main" aria-label="Назад">' + ICON_BACK + '</button><h2>Рівні й досвід</h2></div><div class="section">' +
      '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-family:\'Playfair Display\',serif;font-size:22px">Рівень ' + L.level + '</b><span class="sub">' + rankOf(L.level) + '</span></div>' +
      '<div class="bar" style="margin-top:12px"><div style="width:' + Math.min(100, L.cur / L.need * 100) + '%"></div></div>' +
      '<div class="xp-row"><span>' + num(L.cur) + ' / ' + num(L.need) + ' XP</span><span>ще ≈ ' + Math.max(1, Math.ceil((L.need - L.cur) / (x.play + x.win / 2 + x.survive / 2))) + ' ігор</span></div></div>' +
      '<div class="label" style="margin-top:18px">За що дають досвід</div><div class="list">' +
      src.map(function (s) { return '<div class="li"><span' + (s[1] === "0" ? ' style="color:var(--muted)"' : "") + '>' + s[0] + '</span><b style="color:' + (s[1] === "0" ? "var(--red)" : "var(--green)") + ';white-space:nowrap">' + s[1] + '</b></div>'; }).join("") +
      '</div><div class="note">З рівня N на N+1 треба ' + R.levelStep + ' XP × N. Перші рівні йдуть швидко, далі повільніше.</div>' +
      '<div class="label" style="margin-top:18px">Звання</div>' +
      R.ranks.map(function (r, i) {
        var next = R.ranks[i + 1], me = L.level >= r[0] && (!next || L.level < next[0]);
        return '<div class="rank' + (me ? " me" : "") + '"><div class="l">' + r[0] + (next ? "–" + (next[0] - 1) : "+") + '</div><b style="flex:1">' + r[1] + '</b><span style="font-size:11px;color:var(--muted)">' + (me ? "ти тут" : "") + '</span></div>';
      }).join("") +
      '<div class="label" style="margin-top:18px">Нагороди за рівні</div><div class="list">' +
      R.levelRewards.map(function (r) {
        var frames = FRAMES.filter(function (f) { return !f.ach && f.level === r[0]; }).map(function (f) { return "рамка «" + f.name + "»"; });
        var got = L.level >= r[0];
        return '<div class="li"' + (got ? "" : ' style="opacity:.6"') + '><span><b style="color:var(--gold)">' + r[0] + '</b> · ' + num(r[1]) + ' 💵' + (frames.length ? " · " + frames.join(", ") : "") + '</span><b style="color:var(--green)">' + (got ? "✓" : "") + '</b></div>';
      }).join("") + '</div></div>';
    return h;
  }

  // ---------- малювання й події ----------
  var app = document.getElementById("app");
  function render() {
    app.innerHTML = state.view === "frames" ? framesView() : state.view === "levels" ? levelsView() : mainView();
    if (tg && tg.BackButton) { state.view === "main" ? tg.BackButton.hide() : tg.BackButton.show(); }
  }
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("button");
    if (!el) return;
    if (el.dataset.go) return go(el.dataset.go);
    if (el.dataset.tab) { state.tab = el.dataset.tab; haptic(); return render(); }
    if (el.dataset.scope) { state.scope = el.dataset.scope; haptic(); return render(); }
    if (el.dataset.filter) { state.filter = el.dataset.filter; haptic(); return render(); }
    if (el.dataset.pick) { state.pick = el.dataset.pick; haptic(); return render(); }
    if (el.id === "apply") {
      var link = "https://t.me/" + D.b + "?start=frame_" + state.pick;
      if (D.b && tg && tg.openTelegramLink) { tg.openTelegramLink(link); tg.close(); }
      else if (D.b) { location.href = link; }
      else { current = FRAMES.filter(function (f) { return f.key === state.pick; })[0]; render(); }
    }
  });
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor("#0E1014");
      tg.setBackgroundColor && tg.setBackgroundColor("#0E1014");
      tg.BackButton && tg.BackButton.onClick(function () { go("main"); });
    } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
