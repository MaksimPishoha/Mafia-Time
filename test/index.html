<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Town · Мафія</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Айдентика Time Town: ніч кольору індиго, латунь, тепле світло ліхтаря, холодний синій для ночі й таємного */
  --bg: #0F1220; --card: #171B2B; --inset: #121626; --deep: #0B0E1A; --line: #272C40; --line2: #1F2436; --chip: #262B40;
  --text: #ECE7DA; --muted: #9A95A3; --soft: #C9C3B8; --gold: #E2BE6A; --gold2: #F2D28E; --goldbg: #262019; --lamp: #F5A65B;
  --green: #7FC9A0; --red: #C0453A; --ink: #1A1407; --night: #8FB2F5;
  --serif: 'Playfair Display', Georgia, serif;
  --num: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --hd-h: 72px;   /* висота шапки-міста: однакова на всіх вкладках */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; }
#app.wrap { max-width: none; }
#appBody { max-width: 640px; margin: 0 auto; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
/* шапка вкладки: смуга міста з вежею-годинником і назвою вкладки поверх неба */
.th { position: relative; overflow: hidden; padding-top: var(--safe-top); }
.th-in { position: relative; z-index: 1; min-height: var(--hd-h); max-width: 640px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.th h2 { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; text-shadow: 0 1px 14px rgba(9,12,24,.9); }
.th-r:empty { display: none; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #9AA0AA; cursor: pointer; border-radius: 12px; }
.hero { position: relative; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 0; gap: 6px; text-align: center; }
.ava-wrap { position: relative; margin-bottom: 8px; }
.ava { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ava-in { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); background: var(--chip); display: flex; align-items: center; justify-content: center; font-family: var(--serif); }
.ava-in { position: relative; overflow: hidden; }
.ava-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.lvl-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; border: 2px solid var(--bg); }
h1 { margin: 6px 0 0; font-family: var(--serif); font-size: 22px; line-height: 1.15; word-break: break-word; }
.sub { font-size: 13px; color: var(--soft); }
.tokens { display: flex; gap: 8px; margin-top: 6px; }
.token { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.token.rare { border-color: var(--gold); }
.xp { width: 100%; padding: 0 16px; margin-top: 14px; }
.bar { height: 8px; border-radius: 999px; background: var(--line2); overflow: hidden; }
.bar > div { height: 100%; background: var(--gold); border-radius: 999px; }
.xp-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.actions { display: flex; gap: 8px; padding: 14px 16px 4px; }
.patron { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; color: var(--gold); border: 1px solid rgba(226,190,106,.6); background: rgba(226,190,106,.08); }
.btn { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn:disabled { background: var(--line); color: var(--muted); border-color: var(--line); cursor: default; }
.tabs { display: flex; gap: 4px; margin: 14px 16px 0; padding: 4px; background: var(--card); border-radius: 14px; border: 1px solid var(--line); }
.tab { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; }
.tabs.four .tab { font-size: 12px; }
.split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line2); margin-top: 10px; gap: 2px; }
.split > div { height: 100%; }
.tab.on { background: var(--chip); color: var(--text); }
.section { padding: 14px 16px; }
.label { font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.25; color: var(--text); margin: 0 0 10px; }
.label.mt { margin-top: 20px; }
.cap { font-size: 13px; color: var(--muted); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-h .label { margin: 0; }
.sec-n { font-size: 15px; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--card); border-radius: 12px; padding: 12px 6px; text-align: center; }
.stat b { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; }
.stat span { display: block; font-size: 13px; line-height: 1.25; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line2); border-radius: 18px; padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 12px; }
/* досягнення — другорядні плитки: пласкі, без рамки; рамку має лише отримане рідкісне */
.achs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ach { background: var(--card); border: 1px solid transparent; border-radius: 12px; padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.ach.rare { border-color: rgba(226,190,106,.7); }
.ach.locked { opacity: .5; }
.ach .e { font-size: 28px; line-height: 1.1; }
.ach .n { font-size: 13px; font-weight: 700; line-height: 1.2; }
.ach .d { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ach .s { font-size: 12px; font-weight: 700; margin-top: auto; padding-top: 2px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 34px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 0; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.chip.on { background: var(--chip); color: var(--text); }
.list { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line2); font-size: 15px; }
.li:first-child { border-top: 0; }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
.lock-note { margin: 4px 16px 20px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); display: flex; gap: 10px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.frame-btn { background: var(--card); border: 2px solid transparent; border-radius: 14px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.frame-btn.sel { border-color: var(--gold); }
.frame-btn.locked { opacity: .55; }
.frame-btn .n { font-size: 13px; font-weight: 600; line-height: 1.2; }
.frame-btn .t { font-size: 12px; }
.rank { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid transparent; margin-bottom: 6px; }
.rank.me { background: var(--goldbg); border-color: var(--gold); color: var(--gold); }
.rank .l { width: 52px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.demo { margin: 12px 16px 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
.bottom { position: sticky; bottom: var(--nav-h, 0px); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line2); }
.hidden { display: none !important; }
.char { border-radius: 22px; padding: 4px; }
.char svg { display: block; width: 100%; height: 100%; border-radius: 18px; }
.char-wrap { position: relative; margin-bottom: 8px; }
.flip { width: 150px; height: 180px; padding: 0; border: 0; background: none; cursor: pointer; perspective: 800px; display: block; }
.flip-in { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1); }
.flip.flipped .flip-in { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-face.back { transform: rotateY(180deg); }
.flip:active .flip-in { scale: .97; }
.flip-hint { font-size: 13px; color: var(--muted); margin-top: -2px; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } }
.witem { background: var(--card); border: 2px solid transparent; border-radius: 14px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; text-align: center; min-height: 44px; }
.witem.sel { border-color: var(--gold); }
.witem.locked .thumb { opacity: .45; }
.witem .thumb { width: 72px; height: 86px; border-radius: 12px; overflow: hidden; }
.witem .thumb svg { width: 100%; height: 100%; display: block; }
.witem .n { font-size: 13px; font-weight: 600; line-height: 1.2; }
.witem .t { font-size: 12px; line-height: 1.25; }
/* персонаж v3 (стиль емодзі): картка, мініатюри редактора, кружечки кольорів */
.char.c3 svg, .witem .thumb.c3 { background: var(--inset); }
.sws { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 2px 0 14px; }
.csw { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 3px solid var(--line); cursor: pointer; }
.csw.on { border-color: var(--bg); box-shadow: 0 0 0 3px var(--gold); }
.witem .thumb.c3 { width: 88px; height: 105px; }
.witem.locked.sel .thumb { opacity: 1; }
.sws .cap { margin-left: 2px; }
.l3-reset { width: 100%; min-height: 40px; margin-top: 8px; background: none; border: 0; color: var(--soft); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
/* ---------- живий стіл ---------- */
body.night { --bg: #090C18; background: var(--bg); }
.tbl-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line2); }
.tbl-top h2 { margin: 0; font-family: var(--serif); font-size: 20px; }
.tbl-top .sub { font-size: 12px; }
.pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.ring { position: relative; margin: 14px auto 0; }
/* Амфітеатр: ряди гравців перед табло з фазою й таймером */
.amph { position: relative; margin: 10px auto 0; }
/* Широкий екран (Discord Activity, браузер): три колонки — фаза й дії | зал | журнал */
.wrap.wide { max-width: none; }
.dc-grid { display: grid; grid-template-columns: 320px minmax(0, 1fr) 340px; height: 100vh; }
.dc-left, .dc-right { overflow-y: auto; background: var(--inset); }
body.night .dc-left, body.night .dc-right { background: #0F1526; }
.dc-left { border-right: 1px solid var(--line2); padding-bottom: 16px; }
.dc-right { border-left: 1px solid var(--line2); padding: 8px 0 16px; }
.dc-main { display: flex; flex-direction: column; justify-content: center; min-width: 0; overflow: hidden; }
.dc-main .talking { font-size: 15px; margin-top: 10px; }
.dc-right .log { margin-top: 8px; }
.wide .amph .board { width: min(460px, 70%); height: 84px; }
.wide .amph .board .t { font-size: 42px; }
.wide .amph .board .k, .wide .amph .board .s { font-size: 13px; }
.wide .seat .nm { font-size: 13px; max-width: 120px; }
.wide .seat .num { width: 26px; height: 26px; font-size: 12px; }
.amph .tiers { position: absolute; left: 0; right: 0; border-radius: 22px; background: repeating-linear-gradient(0deg, rgba(160,132,79,.16) 0, rgba(160,132,79,.16) 2px, transparent 3px, transparent var(--row, 110px)); }
body.night .amph .tiers { background: repeating-linear-gradient(0deg, rgba(112,142,213,.2) 0, rgba(112,142,213,.2) 2px, transparent 3px, transparent var(--row, 110px)); }
.amph .board { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: min(260px, 82%); height: 62px; border-radius: 14px; border: 1px solid #625132; background: linear-gradient(120deg, #2A241C, #181B20); box-shadow: 0 12px 30px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
body.night .amph .board { border-color: #465D90; background: linear-gradient(120deg, #25304B, #151C2B); }
.amph .board .k { font-size: 11px; letter-spacing: .14em; font-weight: 700; text-transform: uppercase; color: var(--gold); }
body.night .amph .board .k { color: #91AFFF; }
.amph .board .t { font-family: var(--serif); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.amph .board .s { font-size: 12px; color: var(--soft); max-width: 78px; line-height: 1.25; }
.amph .board .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); transition: width 1s linear; }
.amph .board .bar.low { background: var(--red); }
body.night .amph .board .bar { background: #91AFFF; }
.amph .seat .face { border-radius: 18px 18px 10px 10px; box-shadow: 0 6px 0 #2F2A25, 0 8px 0 rgba(162,133,77,.2); }
.amph .seat .face svg { border-radius: inherit; }
.amph .seat .num { left: -6px; top: -5px; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; }
.seat .face { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; background: var(--chip); border: 3px solid var(--fr, #3A404C); box-sizing: border-box; transition: box-shadow .25s; }
.seat .nm { font-size: 11px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); }
.seat .num { position: absolute; left: -2px; top: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid #3A404C; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.seat .mic { position: absolute; right: -4px; top: calc(var(--sz, 56px) - 18px); width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid #3A404C; display: flex; align-items: center; justify-content: center; }
.seat.dead .face { background: #15181E; color: #5B616C; border-color: #22262F; box-shadow: none; }
.seat.dead .nm { color: #5B616C; text-decoration: line-through; }
/* колір рамки = рамка гравця з профілю; стан гравця — зовнішнє кільце */
.seat.me .face { box-shadow: 0 0 0 3px #5B8DEF; }
.seat.ally .face { box-shadow: 0 0 0 3px var(--red); }
.seat.won .face { box-shadow: 0 0 0 3px var(--gold, #E2BE6A), 0 0 18px rgba(226,190,106,.35); }
.result { font-family: var(--serif); font-size: 20px; font-weight: 700; color: #E2BE6A; }
.seat.can .face { box-shadow: 0 0 0 2px rgba(226,190,106,.45); }
.seat.pick .face { box-shadow: 0 0 0 4px var(--gold), 0 0 24px rgba(226,190,106,.55); }
.seat .votes { position: absolute; right: -6px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.clock { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 50%; background: #14171D; border: 1px solid var(--line); }
.clock .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.clock .t { font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.1; }
.clock .s { font-size: 11px; color: var(--muted); }
.act { margin: 12px 16px 16px; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.act .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.act .v { font-size: 16px; font-weight: 700; }
.act .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
body { transition: background-color 1.2s ease; }
.seat .face { overflow: hidden; position: relative; }
.seat .face svg { width: 100%; height: 100%; display: block; }
.seat.dead .face svg { filter: grayscale(1) brightness(.45); }
.seat .x { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 22px; font-weight: 800; }
.seat .rl { font-size: 10px; }
.seat.talk .face { box-shadow: 0 0 0 4px rgba(226,190,106,.5), 0 0 22px rgba(226,190,106,.45); animation: talk 1.1s ease-in-out infinite; }
@keyframes talk { 50% { box-shadow: 0 0 0 7px rgba(226,190,106,.18), 0 0 30px rgba(226,190,106,.6); } }
.clock .prog { position: absolute; left: 0; top: 0; transform: rotate(-90deg); }
.clock .prog circle { fill: none; stroke-width: 3; }
.clock .prog .track { stroke: #22262F; }
.clock .prog .arc { stroke: var(--gold); stroke-linecap: round; transition: stroke-dasharray .9s linear, stroke .3s; }
.clock .prog .arc.low { stroke: var(--red); }
body.night .clock { background: #0F1422; border-color: #1E2638; }
body.night .clock .prog .arc { stroke: #8FB2F5; }
body.night .clock .prog .arc.low { stroke: var(--red); }
body.night .clock .k { color: #8FB2F5; }
body.night .act, body.night .banner, body.night .log-h { background: #121829; border-color: #253048; }
.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13px; line-height: 1.35; }
.banner.death { border-color: rgba(192,69,58,.55); }
.banner.lynch { border-color: rgba(226,190,106,.55); }
.vc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 16px 0; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.vc-state { font-size: 13px; font-weight: 700; color: var(--muted); }
.vc-state.on { color: var(--green); }
.vc-go { flex: none; min-height: 44px; padding: 0 14px; font-size: 13px; }
body.night .vc-row { background: #121829; border-color: #253048; }
.talking { text-align: center; font-size: 13px; font-weight: 700; color: var(--gold); min-height: 18px; margin: 2px 16px 0; }
.role-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.peek { flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: #1E2336; color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.log { margin: 0 16px 24px; }
.log-h { width: 100%; justify-content: flex-start; padding: 0 14px; }
.log-list { padding: 4px 4px 0; }
.log .ph { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 14px 0 4px; }
.log .ev { font-size: 13px; line-height: 1.35; padding: 7px 0; border-bottom: 1px solid var(--line2); color: var(--soft); }
.log .ev.death { color: #E8A39B; }
.log .ev.lynch { color: var(--gold2); }
.log .ev.secret { color: #B5CBF8; }
.log .ph.secret { color: #8FB2F5; }
.log .dn { color: var(--muted); font-size: 11px; }
.banner.secret { border-color: rgba(91,141,239,.6); background: #131A2B; color: #DCE6FB; display: flex; flex-direction: column; gap: 2px; }
.banner .lock { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8FB2F5; font-weight: 800; }
.seat .kn { color: #8FB2F5; font-weight: 700; }
.seat.known .face { box-shadow: 0 0 0 3px rgba(91,141,239,.55); }

        if (r.status === 401) return { ok: false, text: "Відкрий профіль кнопкою з бота" };
        return await r.json();
      } catch (e) { /* пробуємо запасну адресу */ }
    }
    if (money) return { ok: false, text: "Немає зв'язку з ботом. Перевір склад: покупка могла пройти." };
    return null;
  }
  function applyLook(lk) {
    D.lk = lk;
    SLOT_KEYS.forEach(function (slot, n) { LOOK[slot] = WR["default"][n]; });
    lk.forEach(function (code) { var it = WITEMS[code]; if (it && LOOK.hasOwnProperty(it.slot)) LOOK[it.slot] = it.key; });
  }

  // ---------- малювання й події ----------
  // Широкий екран (від 900 px): сторінки складаються у дві колонки. На телефоні розмітка та сама, що й була.
  function isWide() { return window.innerWidth >= 900; }
  // Що впливає на розкладку ПК: висота (чи стає «Про мене» ліворуч) і дуже широкий екран (більший персонаж). На телефоні — нічого:
  // там висота міняється від клавіатури, і перемальовувати сторінку через це не можна.
  function layoutKey() { return isWide() ? "w" + (window.innerHeight >= 900 ? "t" : "") + (window.innerWidth >= 1500 ? "x" : "") : "n"; }
  var wasKey = layoutKey(), meRight = false;   // meRight: ліва колонка з «Про мене» не влізла в екран — картка йде праворуч
  // Ліва колонка прилипає лише тоді, коли вся влазить в екран: інакше її низ було б не дістати.
  function stickFit() {
    var cols = appBody.querySelectorAll(".pw-l, .duo-l");
    for (var i = 0; i < cols.length; i++) {
      var fits = cols[i].offsetHeight + 32 <= window.innerHeight;
      if (!fits && !meRight && cols[i].querySelector("#meSec")) { meRight = true; return render(); }
      cols[i].classList.toggle("stick", fits);
    }
  }
  window.addEventListener("resize", function () {
    if (layoutKey() === wasKey) { if (state.tab !== "game") stickFit(); return; }
    wasKey = layoutKey(); meRight = false;
    if (state.tab !== "game") render();
  });
  function render() {
    if (state.tab === "game") return;
    appBody.innerHTML = !D ? loadingView() : state.tab === "wardrobe" ? wardrobeTab() : state.tab === "stash" ? stashTab() : profileView();
    drawTop();
    stickFit();
    var chipOn = appBody.querySelector(".chips.slots .chip.on");   // обрана категорія лишається на виду в смужці чіпів
    if (chipOn) chipOn.parentElement.scrollLeft = chipOn.offsetLeft - chipOn.parentElement.offsetLeft - (chipOn.parentElement.clientWidth - chipOn.offsetWidth) / 2;
  }
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("button");
    if (!el) return;
    if (el.id === "profRetry") { profErr = ""; profAt = 0; render(); return loadProfile(); }
    if (!D) return;
    if (el.dataset.open) { state.open = state.open === el.dataset.open ? "" : el.dataset.open; haptic(); return render(); }
    if (el.dataset.gtab) { state.gtab = el.dataset.gtab; haptic(); return render(); }
    if (el.dataset.wsub) { state.wsub = el.dataset.wsub; haptic(); render(); return window.scrollTo(0, 0); }
    if (el.dataset.scroll) { var to = document.getElementById(el.dataset.scroll); if (to) to.scrollIntoView({ behavior: "smooth", block: "start" }); return haptic(); }
    if (el.dataset.link) { if (/^[A-Za-z0-9_]+$/.test(el.dataset.link)) openTg("https://t.me/" + el.dataset.link); return; }
    if (el.dataset.donate) { return openTg("https://t.me/" + D.b + "?start=donate"); }   // оплата зірками — у чаті з ботом
    if (el.id === "flip") {
      state.showChar = !state.showChar; haptic();
      el.classList.toggle("flipped", state.showChar);
      el.setAttribute("aria-label", state.showChar ? "Показати аватарку" : "Показати персонажа");
      var hint = app.querySelector(".flip-hint");
      if (hint) hint.textContent = state.showChar ? "Торкнись, щоб побачити аватарку" : "Торкнись, щоб побачити персонажа";
      return;
    }
    if (el.id === "howBtn") { haptic(); return showOnboard(); }
    if ((el.id === "bioSave" || el.id === "htToggle") && own && !wBusy) {
      var isBio = el.id === "bioSave", inp = document.getElementById("bioIn");
      var body = isBio ? { bio: inp ? inp.value : "" } : { ht: D.ht ? 0 : 1 };
      function meDone(res) {
        wBusy = false;
        if (res && res.ok) {
          if (res.bio) D.bio = String(res.bio).slice(0, 141); else delete D.bio;
          D.ht = res.ht ? 1 : 0;
          if (isBio) state.bioDraft = null;
          haptic();
        }
        render(); showToast(res ? res.text || (res.ok ? "Збережено" : "Не вийшло") : "Немає зв’язку з ботом");
      }
      if (demo) {   // без бота: показуємо лише, як це виглядатиме
        var txt = isBio ? body.bio.replace(/\s+/g, " ").trim().slice(0, 140) : (D.bio || "");
        return meDone({ ok: true, bio: txt, ht: isBio ? D.ht : body.ht, text: "Демо: збережено лише на цьому екрані" });
      }
      if (!WAPI.length) return;
      wBusy = true;
      botCall("/api/me", body).then(meDone);
      return;
    }
    if ((el.dataset.buy || el.dataset.use) && own && !wBusy) {   // склад: купити предмет або перемкнути «брати в гру»
      var isBuy = !!el.dataset.buy, sKey = el.dataset.buy || el.dataset.use, sIx = -1;
      R.items.forEach(function (it, i) { if (it[0] === sKey) sIx = i; });
      if (sIx < 0) return;
      function shopDone(res) {
        wBusy = false;
        if (!res) { render(); return showToast("Немає зв’язку з ботом"); }
        if (res.m !== undefined) D.m = +res.m || 0;                                   // новий баланс одразу
        if (Array.isArray(res.i)) D.i = res.i.map(function (v) { return +v || 0; });
        if (Array.isArray(res.iu)) D.iu = res.iu.map(function (v) { return +v || 0; });
        if (res.ok) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
        render(); showToast(res.text || (res.ok ? "Готово" : "Не вийшло"));
      }
      if (demo) {   // без бота: показуємо лише, як це виглядатиме
        var di = (D.i || [0, 0, 0, 0]).slice(), du = (D.iu || [1, 1, 1, 1]).slice(), dp = +R.items[sIx][4] || 0;
        if (!isBuy) { du[sIx] = du[sIx] ? 0 : 1; return shopDone({ ok: true, m: D.m, i: di, iu: du, text: "Демо: перемкнуто лише на цьому екрані" }); }
        if ((D.m || 0) < dp) return shopDone({ ok: false, m: D.m, i: di, iu: du, text: "Не вистачає грошей: " + R.items[sIx][2] + " коштує " + dp + " 💵" });
        di[sIx] = (di[sIx] || 0) + 1;
        return shopDone({ ok: true, m: D.m - dp, i: di, iu: du, text: "Демо: куплено лише на цьому екрані" });
      }
      if (!WAPI.length) return showToast("Немає зв’язку з ботом. Відкрий профіль кнопкою в особистих з ботом.");
      wBusy = true; el.disabled = true;   // другий клік, поки бот відповідає, нічого не купить
      botCall(isBuy ? "/api/shop" : "/api/use", { key: sKey }).then(shopDone);
      return;
    }
    if (el.dataset.l3cat) { state.l3cat = el.dataset.l3cat; haptic(); return render(); }
    if (el.dataset.l3sex && LOOK3) {   // стать: міняє очі й типові зачіску та статуру; одяг, капелюх, тло й усе обране інше лишається
      var cur3 = state.l3 || LOOK3, sx = el.dataset.l3sex === "f" ? "f" : "m";
      if (cur3.sex !== sx) {
        var nx = Object.assign({}, cur3, { sex: sx, eyes: sx });
        var swap = sx === "f" ? { hair: ["crop", "long"], body: ["broad", "slim"] } : { hair: ["long", "crop"], body: ["slim", "broad"] };
        Object.keys(swap).forEach(function (f) { if (nx[f] === swap[f][0]) nx[f] = swap[f][1]; });
        state.l3 = l3look(nx);
      }
      haptic(); return render();
    }
    if (el.dataset.l3f && LOOK3) {   // приміряти: значення береться лише з каталогу
      var d3 = {}; d3[el.dataset.l3f] = el.dataset.l3v;
      state.l3 = l3look(Object.assign({}, state.l3 || LOOK3, d3));
      if (L3_ORDER.indexOf(el.dataset.l3f) >= 0) state.l3cat = el.dataset.l3f;
      haptic(); return render();
    }
    if (el.id === "l3reset") { state.l3 = null; haptic(); return render(); }
    if (el.id === "l3apply" && LOOK3 && !wBusy) {
      var act3 = el.dataset.action, draft3 = state.l3 || LOOK3, it3 = L3ITEMS.filter(function (x) { return x.key === el.dataset.key; })[0];
      function l3Done(res) {
        wBusy = false;
        if (!res) { render(); return showToast("Немає зв’язку з ботом"); }
        if (res.l3) { D.l3 = res.l3; LOOK3 = l3look(res.l3); }
        if (res.o3 !== undefined) D.o3 = res.o3;
        if (res.m !== undefined) D.m = res.m;
        if (res.ok) {
          if (act3 === "save") state.l3 = null;
          try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
        }
        render(); showToast(res.text || (res.ok ? "Готово" : "Не вийшло"));
      }
      if (demo) {   // без бота: показуємо лише, як це виглядатиме
        if (act3 === "buy" && it3) return l3Done({ ok: true, o3: (D.o3 || 0) | (1 << it3.i), m: (D.m || 0) - it3.n, text: "Демо: куплено лише на цьому екрані" });
        return l3Done({ ok: true, l3: draft3, text: "Демо: збережено лише на цьому екрані" });
      }
      if (!WAPI.length) return showToast("Немає зв’язку з ботом. Відкрий профіль кнопкою в особистих з ботом.");
      wBusy = true; el.disabled = true;
      botCall("/api/look3", act3 === "buy" ? { action: "buy", key: el.dataset.key } : { action: "save", look: draft3 }).then(l3Done);
      return;
    }
    if (el.dataset.slot) { state.slot = el.dataset.slot; state.wpick = ""; haptic(); return render(); }
    if (el.dataset.witem) { state.wpick = el.dataset.witem; if (W_BY_KEY[state.wpick]) state.slot = W_BY_KEY[state.wpick].slot; haptic(); return render(); }
    if (el.id === "wapply" && WAPI.length && !wBusy) {
      wBusy = true; el.disabled = true;
      botCall("/api/wardrobe", { action: el.dataset.action, key: el.dataset.key }).then(function (res) {
        wBusy = false;
        if (!res) return openTg("https://t.me/" + D.b + "?start=" + el.dataset.action + "_" + el.dataset.key);
        if (res.lk) applyLook(res.lk);
        if (res.wb !== undefined) D.wb = res.wb;
        if (res.m !== undefined) D.m = res.m;
        if (res.ok) { state.wpick = ""; try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
        render(); showToast(res.text || (res.ok ? "Готово" : "Не вийшло"));
      });
      return;
    }
    if (el.id === "wapply") return openTg("https://t.me/" + D.b + "?start=" + el.dataset.action + "_" + el.dataset.key);
    if (el.dataset.scope) { state.scope = el.dataset.scope; haptic(); return render(); }
    if (el.dataset.filter) { state.filter = el.dataset.filter; haptic(); return render(); }
    if (el.dataset.pick) { state.pick = el.dataset.pick; haptic(); return render(); }
    if (el.id === "apply" && WAPI.length && own && !wBusy) {
      wBusy = true;
      var want = state.pick;
      botCall("/api/frame", { key: want }).then(function (res) {
        wBusy = false;
        if (res && res.ok) { D.r = want; current = FRAMES.filter(function (f) { return f.key === want; })[0] || current; haptic(); }
        render(); showToast(res ? res.text : "Немає зв'язку з ботом");
      });
      return;
    }
    if (el.id === "apply") {
      var link = "https://t.me/" + D.b + "?start=frame_" + state.pick;
      if (D.b) openTg(link);
      else { current = FRAMES.filter(function (f) { return f.key === state.pick; })[0] || current; render(); }
    }
  });

  app.addEventListener("input", function (ev) {   // чернетка «Про мене» переживає перемальовування
    if (ev.target.id !== "bioIn") return;
    state.bioDraft = ev.target.value;
    var n = document.getElementById("bioN"); if (n) n.textContent = ev.target.value.length + "/140";
  });
  app.addEventListener("keydown", function (ev) {
    if (ev.target.id === "bioIn" && ev.key === "Enter") { var b = document.getElementById("bioSave"); if (b) b.click(); }
  });

  // ---------- знайомство для новачка: чотири короткі екрани при першому відкритті ----------
  var ONB = [
    { t: "Вітаємо в Time Town", d: "Це місто ігор у Telegram. Тут грають у Мафію та Шпигуна, а гаманець, рівень і персонаж у тебе одні на всі ігри.",
      art: function () { return sky(true) + '<div class="onb-masks"><span>🎭</span><span>🕵️</span></div>'; } },
    { t: "Як почати гру", d: "Додай бота в групу з друзями й напиши там <code>/game</code>. Тисни «Приєднатися» — роль прийде в особисті, а тут з’явиться живий стіл.",
      art: function () { return '<div class="onb-chat"><span class="cmd">/game</span><span>Набір відкрито! Хто з нами?</span><span class="go">🎭 Приєднатися</span></div>'; } },
    { t: "Живий стіл", d: "Таймер, гравці й чат гри — на одному екрані. Ходиш і голосуєш дотиком. А свою роль бачиш, лише поки тримаєш кнопку: ніхто не підгляне.",
      art: function () {
        return tableArt();
      } },
    { t: "Гардероб і склад", d: "Одягни персонажа на свій смак, відкривай рамки за досягнення й рівні, а предмети з магазину чекатимуть на гру у складі.",
      art: function () { return '<div class="onb-tiles"><span class="gold"><i>🎩</i>Образ</span><span><i>🖼</i>Рамки</span><span><i>🛡</i>Предмети</span><span><i>💵</i>Гаманець</span></div>'; } }
  ];
  var onbEl = null, onbStep = 0, onbWait = false;
  function onbDraw() {
    var st = ONB[onbStep], last = onbStep === ONB.length - 1;
    onbEl.innerHTML = '<div class="onb-card">' +
      '<div class="onb-prog" role="progressbar" aria-valuemin="1" aria-valuemax="' + ONB.length + '" aria-valuenow="' + (onbStep + 1) + '" aria-label="Крок ' + (onbStep + 1) + ' з ' + ONB.length + '">' +
      ONB.map(function (_, i) { return '<i' + (i <= onbStep ? ' class="on"' : "") + '></i>'; }).join("") + '</div>' +
      (onbStep > 0 && !last ? '<button class="onb-skip" data-onb="skip">Пропустити</button>' : "") +
      '<div class="onb-body"><div class="onb-art" aria-hidden="true">' + st.art() + '</div>' +
      '<h1 id="onbT">' + st.t + '</h1><p>' + st.d + '</p></div>' +
      // «Назад» — щоб повернутись, якщо випадково гортнув далі; «Пропустити» — тихим посиланням угорі.
      '<div class="onb-btns">' + (onbStep > 0 ? '<button class="btn" data-onb="back">‹ Назад</button>' :
        '<button class="btn" data-onb="skip">Пропустити</button>') +
      '<button class="btn primary" data-onb="' + (last ? "done" : "next") + '">' + (last ? "Почати" : "Далі") + '</button></div></div>';
    try { onbEl.querySelector(".btn.primary").focus({ preventScroll: true }); } catch (e) {}
  }
  function closeOnboard() {
    if (onbEl) onbEl.remove();
    onbEl = null;
    document.body.classList.remove("onb-on");
  }
  function showOnboard() {
    onbWait = false;
    if (DEMO_TAB !== "onboard") try { localStorage.setItem("tt_onboard", "1"); } catch (e) {}   // показуємо раз
    if (onbEl) return;
    onbStep = 0;
    onbEl = document.createElement("div");
    onbEl.className = "onb"; onbEl.id = "onb";
    onbEl.setAttribute("role", "dialog"); onbEl.setAttribute("aria-modal", "true"); onbEl.setAttribute("aria-labelledby", "onbT");
    onbEl.addEventListener("click", function (ev) {
      var b = ev.target.closest && ev.target.closest("[data-onb]");
      if (!b) return;
      haptic();
      if (b.dataset.onb === "next") { onbStep++; onbDraw(); }
      else if (b.dataset.onb === "back") { onbStep = Math.max(0, onbStep - 1); onbDraw(); }
      else closeOnboard();
    });
    document.body.appendChild(onbEl);
    document.body.classList.add("onb-on");
    onbDraw();
  }
  document.addEventListener("keydown", function (ev) { if (onbEl && ev.key === "Escape") closeOnboard(); });
  // Кому показати саме: своє вікно в Telegram, уперше. Не в Discord, не на чужому профілі, не в демо (там — ?demo=onboard).
  function onbNeeded() {
    if (DEMO_TAB === "onboard") return true;
    if (demo || DK || (D && !own)) return false;
    try { return localStorage.getItem("tt_onboard") !== "1"; } catch (e) { return false; }
  }

  // ---------- запуск ----------
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor("#0F1220");
      tg.setBackgroundColor && tg.setBackgroundColor("#0F1220");
      tg.BackButton && tg.BackButton.hide();
    } catch (e) {}
  }
  // Стіл живе у вкладці «Гра»: бот опитується й тоді, коли гравець у профілі чи гардеробі.
  var gameApis = demoTable ? ["demo"] : ACT.dk ? [location.origin] : TABLE_APIS.length ? TABLE_APIS : (D && own && !demo && !fromSpy ? WAPI : []);   // у вікні зі Шпигуна стола Мафії немає
  // З чого почати: «Гра» — якщо відкрили кнопкою стола або гравець зараз у партії; інакше профіль.
  var startTab = "profile";
  if (gameApis.length && (demoTable || DK || TABLE_APIS.length || (D && D.gm))) startTab = "game";
  if (D && D.v === "wardrobe" && hasLook) startTab = "wardrobe";
  if (D && fromSpy) { startTab = "profile"; state.open = "spy"; }   // з бота Шпигуна — профіль, розгорнутий на Шпигуні
  if (DEMO_TAB) {
    startTab = { wardrobe: "wardrobe", frames: "wardrobe", levels: "wardrobe", stash: "stash", nogame: "game" }[DEMO_TAB] || "profile";
    if (DEMO_TAB === "frames" || DEMO_TAB === "levels") state.wsub = DEMO_TAB;
    if (DEMO_TAB === "mafia" || DEMO_TAB === "stats") { state.open = "mafia"; state.gtab = DEMO_TAB === "stats" ? "stats" : "dossier"; }
  }
  state.tab = startTab;
  if (gameApis.length) {
    gameCtl = tableMode(gameApis, {
      info: function (i) {
        gameInfo = i; drawNav();
        if (state.tab !== "game") drawTop();   // небо в шапці йде за грою
        if (onbWait && i.known && !i.on) showOnboard();   // гри немає — можна знайомитись; посеред партії не заважаємо
      },
      turn: function () { if (state.tab !== "game") showToast("🔔 Твій хід — відкрий «Гра»"); }
    });
  }
  setTab(startTab, true);
  // Знайомство: одразу, якщо вікно відкрили не заради стола; інакше — коли бот скаже, що гри зараз немає.
  if (onbNeeded()) { if (gameCtl && startTab === "game" && DEMO_TAB !== "onboard") onbWait = true; else showOnboard(); }
})();
</script>
