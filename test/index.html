<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Time · Профіль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  /* Айдентика Time Town (Time Town\\Brand\\tokens.css): графіт, золото, світло вікон, ніч */
  --bg: #0E1013; --card: #161A21; --line: #2A303B; --line2: #20252E; --chip: #2A303B;
  --text: #EAE5D7; --muted: #9C9180; --soft: #C9C1AF; --gold: #E2BE6A; --gold2: #F2CF85;
  --green: #7FC9A0; --red: #C0453A; --ink: #1A1407; --night: #97AEE6;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; }
.wrap { max-width: 480px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line2); min-height: 56px; }
.top h2 { margin: 0; font-size: 15px; font-weight: 700; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #9AA0AA; cursor: pointer; border-radius: 12px; }
.hero { display: flex; flex-direction: column; align-items: center; padding: 22px 16px 16px; gap: 6px; text-align: center; }
.ava-wrap { position: relative; margin-bottom: 8px; }
.ava { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ava-in { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); background: var(--chip); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; }
.ava-in { position: relative; overflow: hidden; }
.ava-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.lvl-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 2px solid var(--bg); }
h1 { margin: 6px 0 0; font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1.15; word-break: break-word; }
.sub { font-size: 13px; color: var(--soft); }
.tokens { display: flex; gap: 8px; margin-top: 6px; }
.token { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.token.rare { border-color: var(--gold); }
.xp { width: 100%; padding: 0 16px; margin-top: 4px; }
.bar { height: 8px; border-radius: 999px; background: var(--line2); overflow: hidden; }
.bar > div { height: 100%; background: var(--gold); border-radius: 999px; }
.xp-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
.actions { display: flex; gap: 8px; padding: 14px 16px 4px; }
.patron { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--gold); border: 1px solid var(--gold); background: rgba(212, 175, 55, .08); }
.btn { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn:disabled { background: var(--line); color: var(--muted); border-color: var(--line); cursor: default; }
.tabs { display: flex; gap: 4px; margin: 14px 16px 0; padding: 4px; background: var(--card); border-radius: 14px; border: 1px solid var(--line); }
.tab { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; }
.tabs.four .tab { font-size: 12px; }
.split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line2); margin-top: 10px; gap: 2px; }
.split > div { height: 100%; }
.tab.on { background: var(--chip); color: var(--text); }
.section { padding: 14px 16px; }
.label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 4px 0 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 800; }
.stat span { font-size: 11px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.ach { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
.ach.rare { border-color: var(--gold); }
.ach.locked { opacity: .45; }
.ach .e { font-size: 26px; line-height: 1.1; }
.ach .n { font-size: 12px; font-weight: 700; line-height: 1.2; }
.ach .d { font-size: 10px; color: var(--muted); line-height: 1.25; }
.ach .s { font-size: 11px; font-weight: 800; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 32px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 0; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.chip.on { background: var(--chip); color: var(--text); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.li:first-child { border-top: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
.lock-note { margin: 4px 16px 20px; padding: 12px 14px; border-radius: 12px; border: 1px dashed #2E333D; display: flex; gap: 10px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.frame-btn { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.frame-btn.sel { border-color: var(--gold); }
.frame-btn.locked { opacity: .55; }
.frame-btn .n { font-size: 11px; font-weight: 700; line-height: 1.2; }
.frame-btn .t { font-size: 10px; }
.rank { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; }
.rank.me { background: #1F1B12; border-color: var(--gold); color: var(--gold); }
.rank .l { width: 52px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.demo { margin: 10px 16px 0; padding: 8px 12px; border-radius: 10px; background: #1F1B12; color: var(--gold); font-size: 12px; text-align: center; }
.bottom { position: sticky; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line2); }
.hidden { display: none !important; }
.char { border-radius: 22px; padding: 4px; }
.char svg { display: block; width: 100%; height: 100%; border-radius: 18px; }
.char-wrap { position: relative; margin-bottom: 8px; }
.flip { width: 150px; height: 180px; padding: 0; border: 0; background: none; cursor: pointer; perspective: 800px; display: block; }
.flip-in { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1); }
.flip.flipped .flip-in { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-face.back { transform: rotateY(180deg); }
.flip:active .flip-in { scale: .97; }
.flip-hint { font-size: 11px; color: var(--muted); margin-top: -2px; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } }
.witem { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; text-align: center; min-height: 44px; }
.witem.sel { border-color: var(--gold); }
.witem.locked .thumb { opacity: .45; }
.witem .thumb { width: 72px; height: 86px; border-radius: 12px; overflow: hidden; }
.witem .thumb svg { width: 100%; height: 100%; display: block; }
.witem .n { font-size: 11px; font-weight: 700; line-height: 1.2; }
.witem .t { font-size: 10px; line-height: 1.25; }
/* ---------- живий стіл ---------- */
body.night { background: #0A0D16; }
.tbl-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line2); }
.tbl-top h2 { margin: 0; font-family: 'Playfair Display', serif; font-size: 20px; }
.tbl-top .sub { font-size: 12px; }
.pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.ring { position: relative; margin: 14px auto 0; }
/* Амфітеатр: ряди гравців перед табло з фазою й таймером */
.amph { position: relative; margin: 10px auto 0; }
/* Широкий екран (Discord Activity, браузер): три колонки — фаза й дії | зал | журнал */
.wrap.wide { max-width: none; }
.dc-grid { display: grid; grid-template-columns: 320px minmax(0, 1fr) 340px; height: 100vh; }
.dc-left, .dc-right { overflow-y: auto; background: #12151B; }
body.night .dc-left, body.night .dc-right { background: #0F1526; }
.dc-left { border-right: 1px solid var(--line2); padding-bottom: 16px; }
.dc-right { border-left: 1px solid var(--line2); padding: 8px 0 16px; }
.dc-main { display: flex; flex-direction: column; justify-content: center; min-width: 0; overflow: hidden; }
.dc-main .talking { font-size: 15px; margin-top: 10px; }
.dc-right .log { margin-top: 8px; }
.wide .amph .board { width: min(460px, 70%); height: 84px; }
.wide .amph .board .t { font-size: 42px; }
.wide .amph .board .k, .wide .amph .board .s { font-size: 13px; }
.wide .seat .nm { font-size: 13px; max-width: 120px; }
.wide .seat .num { width: 26px; height: 26px; font-size: 12px; }
.amph .tiers { position: absolute; left: 0; right: 0; border-radius: 22px; background: repeating-linear-gradient(0deg, rgba(160,132,79,.16) 0, rgba(160,132,79,.16) 2px, transparent 3px, transparent var(--row, 110px)); }
body.night .amph .tiers { background: repeating-linear-gradient(0deg, rgba(112,142,213,.2) 0, rgba(112,142,213,.2) 2px, transparent 3px, transparent var(--row, 110px)); }
.amph .board { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: min(260px, 82%); height: 62px; border-radius: 14px; border: 1px solid #625132; background: linear-gradient(120deg, #2A241C, #181B20); box-shadow: 0 12px 30px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
body.night .amph .board { border-color: #465D90; background: linear-gradient(120deg, #25304B, #151C2B); }
.amph .board .k { font-size: 11px; letter-spacing: .14em; font-weight: 700; text-transform: uppercase; color: var(--gold); }
body.night .amph .board .k { color: #91AFFF; }
.amph .board .t { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.amph .board .s { font-size: 12px; color: var(--soft); max-width: 78px; line-height: 1.25; }
.amph .board .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); transition: width 1s linear; }
.amph .board .bar.low { background: var(--red); }
body.night .amph .board .bar { background: #91AFFF; }
.amph .seat .face { border-radius: 18px 18px 10px 10px; box-shadow: 0 6px 0 #2F2A25, 0 8px 0 rgba(162,133,77,.2); }
.amph .seat .face svg { border-radius: inherit; }
.amph .seat .num { left: -6px; top: -5px; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; }
.seat .face { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; background: var(--chip); border: 3px solid var(--fr, #3A404C); box-sizing: border-box; transition: box-shadow .25s; }
.seat .nm { font-size: 11px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); }
.seat .num { position: absolute; left: -2px; top: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid #3A404C; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.seat .mic { position: absolute; right: -4px; top: calc(var(--sz, 56px) - 18px); width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid #3A404C; display: flex; align-items: center; justify-content: center; }
.seat.dead .face { background: #15181E; color: #5B616C; border-color: #22262F; box-shadow: none; }
.seat.dead .nm { color: #5B616C; text-decoration: line-through; }
/* колір рамки = рамка гравця з профілю; стан гравця — зовнішнє кільце */
.seat.me .face { box-shadow: 0 0 0 3px #5B8DEF; }
.seat.ally .face { box-shadow: 0 0 0 3px var(--red); }
.seat.won .face { box-shadow: 0 0 0 3px var(--gold, #E2BE6A), 0 0 18px rgba(226,190,106,.35); }
.result { font-family: "Playfair Display", serif; font-size: 20px; font-weight: 700; color: #E2BE6A; }
.seat.can .face { box-shadow: 0 0 0 2px rgba(226,190,106,.45); }
.seat.pick .face { box-shadow: 0 0 0 4px var(--gold), 0 0 24px rgba(226,190,106,.55); }
.seat .votes { position: absolute; right: -6px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.clock { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 50%; background: #14171D; border: 1px solid var(--line); }
.clock .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.clock .t { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
.clock .s { font-size: 11px; color: var(--muted); }
.act { margin: 12px 16px 16px; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.act .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.act .v { font-size: 16px; font-weight: 700; }
.act .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
body { transition: background-color 1.2s ease; }
.seat .face { overflow: hidden; position: relative; }
.seat .face svg { width: 100%; height: 100%; display: block; }
.seat.dead .face svg { filter: grayscale(1) brightness(.45); }
.seat .x { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 22px; font-weight: 800; }
.seat .rl { font-size: 10px; }
.seat.talk .face { box-shadow: 0 0 0 4px rgba(226,190,106,.5), 0 0 22px rgba(226,190,106,.45); animation: talk 1.1s ease-in-out infinite; }
@keyframes talk { 50% { box-shadow: 0 0 0 7px rgba(226,190,106,.18), 0 0 30px rgba(226,190,106,.6); } }
.clock .prog { position: absolute; left: 0; top: 0; transform: rotate(-90deg); }
.clock .prog circle { fill: none; stroke-width: 3; }
.clock .prog .track { stroke: #22262F; }
.clock .prog .arc { stroke: var(--gold); stroke-linecap: round; transition: stroke-dasharray .9s linear, stroke .3s; }
.clock .prog .arc.low { stroke: var(--red); }
body.night .clock { background: #0F1422; border-color: #1E2638; }
body.night .clock .prog .arc { stroke: #8FB2F5; }
body.night .clock .prog .arc.low { stroke: var(--red); }
body.night .clock .k { color: #8FB2F5; }
body.night .act, body.night .banner, body.night .log-h { background: #121829; border-color: #253048; }
.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13px; line-height: 1.35; }
.banner.death { border-color: rgba(192,69,58,.55); }
.banner.lynch { border-color: rgba(226,190,106,.55); }
.vc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 16px 0; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.vc-state { font-size: 13px; font-weight: 700; color: var(--muted); }
.vc-state.on { color: var(--green); }
.vc-go { flex: none; min-height: 44px; padding: 0 14px; font-size: 13px; }
body.night .vc-row { background: #121829; border-color: #253048; }
.talking { text-align: center; font-size: 13px; font-weight: 700; color: var(--gold); min-height: 18px; margin: 2px 16px 0; }
.role-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.peek { flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: #1E222B; color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.log { margin: 0 16px 24px; }
.log-h { width: 100%; justify-content: flex-start; padding: 0 14px; }
.log-list { padding: 4px 4px 0; }
.log .ph { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 14px 0 4px; }
.log .ev { font-size: 13px; line-height: 1.35; padding: 7px 0; border-bottom: 1px solid var(--line2); color: var(--soft); }
.log .ev.death { color: #E8A39B; }
.log .ev.lynch { color: var(--gold2); }
.log .ev.secret { color: #B5CBF8; }
.log .ph.secret { color: #8FB2F5; }
.log .dn { color: var(--muted); font-size: 11px; }
.banner.secret { border-color: rgba(91,141,239,.6); background: #131A2B; color: #DCE6FB; display: flex; flex-direction: column; gap: 2px; }
.banner .lock { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8FB2F5; font-weight: 800; }
.seat .kn { color: #8FB2F5; font-weight: 700; }
.seat.known .face { box-shadow: 0 0 0 3px rgba(91,141,239,.55); }
.phase-flash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: #EDE6D6; background: rgba(14,16,20,.55); animation: flash 1.8s ease forwards; z-index: 8; }
.phase-flash.night { background: rgba(10,13,22,.75); color: #B5CBF8; }
@keyframes flash { 0% { opacity: 0; } 20% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } .seat.talk .face { animation: none; } .clock .prog .arc { transition: none; } }
#wtoast { bottom: 96px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2A2416; border: 1px solid var(--gold); color: var(--gold2); padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: 90vw; z-index: 9; }
/* ===== Айдентика Time Town: шрифти, мітки, місто, циферблат ===== */
h1, .tbl-top h2 { font-weight: 800; letter-spacing: -.01em; }
.stat b, .lvl-badge, .pill, .clock .t, .amph .board .t, .rank .l, .xp-row, .seat .num, .seat .votes, .price, .token { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.clock .t, .amph .board .t { font-weight: 500; letter-spacing: .02em; }
.label, .act .k, .log .ph, .amph .board .k, .clock .k, .banner .lock { font-family: var(--mono); font-weight: 500; letter-spacing: .2em; }
.label { display: flex; align-items: center; gap: 10px; color: var(--gold); }
.label::before { content: ""; width: 18px; height: 1px; background: currentColor; flex: none; }
.btn, .vc-go, .peek { border-radius: 999px; }

    var n = s[0], w = s[1], town = s[2], maf = s[3], killed = s[4], first = s[5], lynched = s[6], alive = s[7], roles = s[8] || [];
    var h = '<div class="section">';
    if (scopes.length > 1) {
      h += '<div class="chips" role="tablist">' + scopes.map(function (sc) {
        return '<button class="chip' + (state.scope === sc[0] ? " on" : "") + '" data-scope="' + sc[0] + '" aria-pressed="' + (state.scope === sc[0]) + '">' + esc(sc[1]) + '</button>';
      }).join("") + '</div>';
    }
    if (!n) return h + '<div class="card" style="color:var(--muted);text-align:center">Ще немає зіграних ігор.</div></div>';
    h += '<div class="grid3">' +
      '<div class="stat"><b>' + num(n) + '</b><span>ігор</span></div>' +
      '<div class="stat"><b style="color:var(--green)">' + num(w) + '</b><span>перемог · ' + pct(w, n) + '</span></div>' +
      '<div class="stat"><b style="color:var(--red)">' + num(n - w) + '</b><span>поразок · ' + pct(n - w, n) + '</span></div></div>';
    h += '<div class="label" style="margin-top:16px">Сторони</div><div class="card">' +
      '<div class="row" style="justify-content:space-between;font-size:14px"><span>👨🏼 За мирних <b>' + town + '</b></span><span>🤵🏻 За мафію <b>' + maf + '</b></span></div>' +
      '<div class="split"><div style="width:' + (n ? town / n * 100 : 0) + '%;background:var(--green)"></div><div style="width:' + (n ? maf / n * 100 : 0) + '%;background:var(--red)"></div></div>' +
      '<div class="xp-row"><span>' + pct(town, n) + '</span><span>' + (n - town - maf > 0 ? "інші " + pct(n - town - maf, n) : "") + '</span><span>' + pct(maf, n) + '</span></div></div>';
    h += '<div class="label" style="margin-top:16px">Як закінчувались ігри</div><div class="list">' +
      [["☠️ Убито вночі", killed], ["🌑 Першої ж ночі", first], ["⚖️ Страчено вдень", lynched], ["❤️ Дожив до кінця", alive]].map(function (r) {
        return '<div class="li"><span>' + r[0] + '</span><span><b>' + r[1] + '</b> <span style="color:var(--muted);font-size:12px">' + pct(r[1], n) + '</span></span></div>';
      }).join("") + '</div>';
    var list = roles.map(function (c, i) { return [ROLE_KEYS[i], c]; }).filter(function (r) { return r[1] > 0 && R.roles[r[0]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    if (list.length) {
      var top = list[0][1];
      h += '<div class="label" style="margin-top:16px">Ролі</div><div class="list">' + list.map(function (r) {
        var role = R.roles[r[0]];
        return '<div class="li" style="display:block"><div class="row" style="justify-content:space-between"><span>' + role[0] + ' ' + esc(role[1]) + '</span>' +
          '<span><b>' + r[1] + '</b> <span style="color:var(--muted);font-size:12px">' + pct(r[1], n) + '</span></span></div>' +
          '<div class="bar" style="height:5px;margin-top:7px"><div style="width:' + (r[1] / top * 100) + '%"></div></div></div>';
      }).join("") + '</div>';
    }
    h += '<div class="note">Тестові ігри з ботами не враховуються. Детальніше в чаті: /stat, /stat_all, /stat_chat.</div></div>';
    return h;
  }

  function achList() {
    var filters = [["all", "Усі"], ["done", "Отримані"], ["rare", "Рідкісні"]];
    var h = '<div class="section"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-family:\'Playfair Display\',serif;font-size:20px">' + earnedCount + ' з ' + ACH.length + '</b></div>' +
      '<div class="bar" style="margin-bottom:14px"><div style="width:' + (earnedCount / ACH.length * 100) + '%"></div></div>' +
      '<div class="chips">' + filters.map(function (f) { return '<button class="chip' + (state.filter === f[0] ? " on" : "") + '" data-filter="' + f[0] + '">' + f[1] + '</button>'; }).join("") + '</div>';
    var list = ACH.filter(function (a) {
      if (state.filter === "done") return earned(a);
      if (state.filter === "rare") return a.rare;
      return true;
    });
    h += '<div class="grid3">' + list.map(function (a) {
      var got = earned(a);
      if (!got && a.secret) return '<div class="ach locked"><div class="e">🔒</div><div class="n">???</div><div class="d">Таємне досягнення</div><div class="s" style="color:var(--muted)">?</div></div>';
      var p = (D.p || [])[a.i] || 0;
      var st = got ? (a.rare ? "Рідкісне ✓" : "✓") : (a.goal > 1 ? p + "/" + a.goal : "—");
      return '<div class="ach' + (got && a.rare ? " rare" : "") + '"' + (got ? "" : ' style="opacity:.75"') + '><div class="e">' + a.emoji + '</div><div class="n">' + esc(a.name) + '</div>' +
        '<div class="d">' + esc(a.desc) + '</div><div class="s" style="color:' + (got ? "var(--green)" : "var(--gold)") + '">' + st + '</div></div>';
    }).join("") + '</div>';
    if (!list.length) h += '<div class="note">Тут поки порожньо.</div>';
    h += '<div class="note">За кожне досягнення дають досвід, а емодзі стає жетоном у профілі. Рідкісні відкривають рамки.</div></div>';
    return h;
  }

  function framesView() {
    var pick = FRAMES.filter(function (f) { return f.key === state.pick; })[0] || current;
    var h = '<div class="top"><button class="icon-btn" data-go="main" aria-label="Назад">' + ICON_BACK + '</button><h2>Рамка профілю</h2></div>' +
      '<div class="hero" style="border-bottom:1px solid var(--line2)">' + avatar(pick, 124, 44) +
      '<h1 style="font-size:20px;margin-top:10px">' + esc(pick.name) + '</h1><div class="sub" style="color:var(--muted);font-size:12px">' + esc(frameHow(pick)) + '</div></div>' +
      '<div class="section"><div class="grid3">' + FRAMES.map(function (f) {
        var ok = frameOwned(f);
        var tag = f.key === current.key ? "Обрана" : (ok ? "Є" : (f.ach ? "Досягнення" : "Рівень " + f.level));
        return '<button class="frame-btn' + (f.key === pick.key ? " sel" : "") + (ok ? "" : " locked") + '" data-pick="' + f.key + '" aria-pressed="' + (f.key === pick.key) + '">' +
          avatar(f, 54, 0) + '<div class="n">' + esc(f.name) + '</div><div class="t" style="color:' + (ok ? "var(--green)" : "var(--muted)") + '">' + tag + '</div></button>';
      }).join("") + '</div></div>';
    var ok = frameOwned(pick);
    var label = pick.key === current.key ? "Уже обрано" : (ok ? "Встановити рамку" : "Ще не відкрито: " + frameHow(pick));
    h += '<div class="bottom"><button class="btn primary" id="apply"' + (ok && pick.key !== current.key ? "" : " disabled") + ' style="width:100%;min-height:50px;font-size:15px">' + esc(label) + '</button>' +
      (D.b ? "" : '<div class="note" style="text-align:center">У демо рамка не зберігається.</div>') + '</div>';
    return h;
  }

  function wardrobeView() {
    var slot = state.slot;
    var items = WITEMS.filter(function (w) { return w.slot === slot; });
    var pick = W_BY_KEY[state.wpick] && W_BY_KEY[state.wpick].slot === slot ? W_BY_KEY[state.wpick] : W_BY_KEY[LOOK[slot]];
    var preview = Object.assign({}, LOOK); preview[pick.slot] = pick.key;
    var canEdit = own && !fromSpy && D.b;
    var h = '<div class="top"><button class="icon-btn" data-go="main" aria-label="Назад">' + ICON_BACK + '</button><h2>Гардероб</h2>' +
      (D.m !== undefined ? '<span style="margin-left:auto;padding-right:8px;font-weight:800;font-size:14px">' + num(D.m) + ' 💵</span>' : "") + '</div>';
    if (demo) h += '<div class="demo">Демо: так виглядатиме гардероб.</div>';
    h += '<div class="hero" style="padding-top:16px">' + charCard(preview, 180) +
      '<h1 style="font-size:20px">' + esc(pick.name) + '</h1><div class="sub">' + esc(wTag(pick, true)) + '</div></div>';
    h += '<div class="tabs" role="tablist">' + WR.slots.map(function (s) {
      return '<button class="tab' + (slot === s[0] ? " on" : "") + '" role="tab" aria-selected="' + (slot === s[0]) + '" data-slot="' + s[0] + '">' + esc(s[1]) + '</button>';
    }).join("") + '</div>';
    h += '<div class="section"><div class="grid3">' + items.map(function (w) {
      var look = Object.assign({}, LOOK); look[w.slot] = w.key;
      var open = wOpen(w), worn = LOOK[w.slot] === w.key;
      var color = worn ? "var(--gold)" : open ? "var(--soft)" : w.how === "price" ? "var(--green)" : "var(--muted)";
      return '<button class="witem' + (w.key === pick.key ? " sel" : "") + (open ? "" : " locked") + '" data-witem="' + w.key + '" aria-pressed="' + (w.key === pick.key) + '">' +
        '<div class="thumb">' + charSVG(look) + '</div><div class="n">' + esc(w.name) + '</div><div class="t" style="color:' + color + '">' + esc(wTag(w, false)) + '</div></button>';
    }).join("") + '</div><div class="note">Персонаж один на всі ігри Time Town. Речі відкриваються рівнем, досягненнями з Мафії й Шпигуна або купуються за спільні 💵.</div></div>';
    var label, ok = false, action = "";
    if (LOOK[pick.slot] === pick.key) label = pick.slot === "body" ? "Уже обрано" : "Уже вдягнено";
    else if (wOpen(pick)) { label = pick.slot === "body" ? "Обрати: " + pick.name.toLowerCase() + " персонаж" : "Вдягнути «" + pick.name + "»"; ok = true; action = "look"; }
    else if (pick.how === "price") {
      var enough = D.m === undefined || D.m >= pick.value;
      label = enough ? "Купити за " + num(pick.value) + " 💵" : "Не вистачає 💵 (" + num(pick.value) + ")"; ok = enough; action = "buy";
    } else label = "Закрито: " + pick.hint;
    if (!canEdit) { ok = false; if (!demo && own && fromSpy) label = "Змінити образ: бот Mafia Time → /wardrobe"; }
    h += '<div class="bottom"><button class="btn primary" id="wapply" data-action="' + action + '" data-key="' + pick.key + '"' + (ok ? "" : " disabled") + ' style="width:100%;min-height:50px;font-size:15px">' + esc(label) + '</button>' +
      (canEdit && ok ? '<div class="note" style="text-align:center">' + (WAPI.length ? "Зміниться одразу тут." : "Бот підтвердить і поверне тебе в гардероб.") + '</div>' : "") + '</div>';
    return h;
  }
  function wTag(w, long) {
    if (LOOK[w.slot] === w.key) return w.slot === "body" ? "Обрано" : "Вдягнено";
    if (wOpen(w)) return w.slot === "body" ? "Обрати" : long ? "Відкрито" : "Є";
    if (w.how === "price") return num(w.value) + " 💵";
    if (w.how === "level") return "Рівень " + w.value;
    return long ? w.hint : (w.game === "spy" ? "Шпигун: " : "Мафія: ") + (w.hint.match(/«([^»]+)»/) || ["", w.hint])[1];
  }

  function levelsView() {
    var x = R.xp;
    var src = [["Зіграна гра до кінця", "+" + x.play + " XP"], ["Перемога команди", "+" + x.win + " XP"], ["Дожив до кінця гри", "+" + x.survive + " XP"],
      ["Корисний хід (знайшов мафію, врятував, відволік)", "+" + x.feat + " XP, до +" + x.featCap], ["Нове досягнення", "+50…300 XP"],
      ["Вигнали за неактивність", "0"], ["Тестова гра з ботами", "0"]];
    var h = '<div class="top"><button class="icon-btn" data-go="main" aria-label="Назад">' + ICON_BACK + '</button><h2>Рівні й досвід</h2></div><div class="section">' +
      '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-family:\'Playfair Display\',serif;font-size:22px">Рівень ' + L.level + '</b><span class="sub">' + rankOf(L.level) + '</span></div>' +
      '<div class="bar" style="margin-top:12px"><div style="width:' + Math.min(100, L.cur / L.need * 100) + '%"></div></div>' +
      '<div class="xp-row"><span>' + num(L.cur) + ' / ' + num(L.need) + ' XP</span><span>ще ≈ ' + Math.max(1, Math.ceil((L.need - L.cur) / (x.play + x.win / 2 + x.survive / 2))) + ' ігор</span></div></div>' +
      '<div class="label" style="margin-top:18px">У Мафії</div><div class="list">' +
      src.map(function (s) { return '<div class="li"><span' + (s[1] === "0" ? ' style="color:var(--muted)"' : "") + '>' + s[0] + '</span><b style="color:' + (s[1] === "0" ? "var(--red)" : "var(--green)") + ';white-space:nowrap">' + s[1] + '</b></div>'; }).join("") +
      '</div>' + (SPY_R.xp && SPY_R.xp.play ? '<div class="label" style="margin-top:18px">У Шпигуні</div><div class="list">' +
        [["Зіграна гра", "+" + SPY_R.xp.play + " XP"], ["Перемога", "+" + SPY_R.xp.win + " XP"], ["Вгадав слово шпигуном", "+" + SPY_R.xp.guess + " XP"], ["Вистежив шпигуна", "+" + SPY_R.xp.hunt + " XP"]]
          .map(function (s) { return '<div class="li"><span>' + s[0] + '</span><b style="color:var(--green);white-space:nowrap">' + s[1] + '</b></div>'; }).join("") + '</div>' : "") +
      '<div class="note">Рівень один на всі ігри Time Town: досвід з Мафії та Шпигуна складається. З рівня N на N+1 треба ' + R.levelStep + ' XP × N.</div>' +
      '<div class="label" style="margin-top:18px">Звання</div>' +
      R.ranks.map(function (r, i) {
        var next = R.ranks[i + 1], me = L.level >= r[0] && (!next || L.level < next[0]);
        return '<div class="rank' + (me ? " me" : "") + '"><div class="l">' + r[0] + (next ? "–" + (next[0] - 1) : "+") + '</div><b style="flex:1">' + r[1] + '</b><span style="font-size:11px;color:var(--muted)">' + (me ? "ти тут" : "") + '</span></div>';
      }).join("") +
      '<div class="label" style="margin-top:18px">Нагороди за рівні</div><div class="list">' +
      R.levelRewards.map(function (r) {
        var frames = FRAMES.filter(function (f) { return !f.ach && f.level === r[0]; }).map(function (f) { return "рамка «" + f.name + "»"; });
        var got = L.level >= r[0];
        return '<div class="li"' + (got ? "" : ' style="opacity:.6"') + '><span><b style="color:var(--gold)">' + r[0] + '</b> · ' + num(r[1]) + ' 💵' + (frames.length ? " · " + frames.join(", ") : "") + '</span><b style="color:var(--green)">' + (got ? "✓" : "") + '</b></div>';
      }).join("") + '</div></div>';
    return h;
  }

  // ---------- малювання й події ----------
  var app = document.getElementById("app");
  // ---------- зміни прямо у вікні (через адресу бота, якщо вона є) ----------
  var WAPI = (Array.isArray(D.api) ? D.api : []).filter(botApi);
  var wBusy = false, wToast = "", wToastTimer = null;
  function showToast(text) {
    wToast = text; clearTimeout(wToastTimer);
    wToastTimer = setTimeout(function () { wToast = ""; var el = document.getElementById("wtoast"); if (el) el.remove(); }, 2600);
    var el = document.getElementById("wtoast");
    if (!el) { el = document.createElement("div"); el.id = "wtoast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = text;
  }
  async function botCall(path, body) {
    var payload = JSON.stringify(Object.assign({ init: (tg && tg.initData) || "" }, body));
    for (var i = 0; i < WAPI.length; i++) {
      try {
        var r = await fetch(WAPI[i].replace(/\/$/, "") + path, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: payload });
        if (r.status === 401) return { ok: false, text: "Відкрий профіль кнопкою з бота" };
        return await r.json();
      } catch (e) { /* пробуємо запасну адресу */ }
    }
    return null;
  }
  function applyLook(lk) {
    D.lk = lk;
    SLOT_KEYS.forEach(function (slot, n) { LOOK[slot] = WR["default"][n]; });
    lk.forEach(function (code) { var it = WITEMS[code]; if (it && LOOK.hasOwnProperty(it.slot)) LOOK[it.slot] = it.key; });
  }
  function render() {
    app.innerHTML = state.view === "frames" ? framesView() : state.view === "levels" ? levelsView() : state.view === "wardrobe" ? wardrobeView() : mainView();
    if (tg && tg.BackButton) { state.view === "main" ? tg.BackButton.hide() : tg.BackButton.show(); }
  }
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("button");
    if (!el) return;
    if (el.dataset.go) return go(el.dataset.go);
    if (el.dataset.donate) {   // оплата зірками — у чаті з ботом
      var dl = "https://t.me/" + D.b + "?start=donate";
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(dl); tg.close(); } else { location.href = dl; }
      return;
    }
    if (el.id === "flip") {
      state.showChar = !state.showChar; haptic();
      el.classList.toggle("flipped", state.showChar);
      el.setAttribute("aria-label", state.showChar ? "Показати аватарку" : "Показати персонажа");
      var hint = app.querySelector(".flip-hint");
      if (hint) hint.textContent = state.showChar ? "Торкнись, щоб побачити аватарку" : "Торкнись, щоб побачити персонажа";
      return;
    }
    if (el.dataset.slot) { state.slot = el.dataset.slot; state.wpick = ""; haptic(); return render(); }
    if (el.dataset.witem) { state.wpick = el.dataset.witem; haptic(); return render(); }
    if (el.id === "wapply" && WAPI.length && !wBusy) {
      wBusy = true; el.disabled = true;
      botCall("/api/wardrobe", { action: el.dataset.action, key: el.dataset.key }).then(function (res) {
        wBusy = false;
        if (!res) { var wl0 = "https://t.me/" + D.b + "?start=" + el.dataset.action + "_" + el.dataset.key; if (tg && tg.openTelegramLink) { tg.openTelegramLink(wl0); tg.close(); } else { location.href = wl0; } return; }
        if (res.lk) applyLook(res.lk);
        if (res.wb !== undefined) D.wb = res.wb;
        if (res.m !== undefined) D.m = res.m;
        if (res.ok) { state.wpick = ""; try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
        render(); showToast(res.text || (res.ok ? "Готово" : "Не вийшло"));
      });
      return;
    }
    if (el.id === "wapply") {
      var wl = "https://t.me/" + D.b + "?start=" + el.dataset.action + "_" + el.dataset.key;
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(wl); tg.close(); } else { location.href = wl; }
      return;
    }
    if (el.dataset.game) { state.game = el.dataset.game; state.tab = "overview"; state.filter = "all"; haptic(); return render(); }
    if (el.dataset.tab) { state.tab = el.dataset.tab; haptic(); return render(); }
    if (el.dataset.scope) { state.scope = el.dataset.scope; haptic(); return render(); }
    if (el.dataset.filter) { state.filter = el.dataset.filter; haptic(); return render(); }
    if (el.dataset.pick) { state.pick = el.dataset.pick; haptic(); return render(); }
    if (el.id === "apply" && WAPI.length && own && !wBusy) {
      wBusy = true;
      var want = state.pick;
      botCall("/api/frame", { key: want }).then(function (res) {
        wBusy = false;
        if (res && res.ok) { D.r = want; current = FRAMES.filter(function (f) { return f.key === want; })[0] || current; haptic(); }
        render(); showToast(res ? res.text : "Немає зв'язку з ботом");
      });
      return;
    }
    if (el.id === "apply") {
      var link = "https://t.me/" + D.b + "?start=frame_" + state.pick;
      if (D.b && tg && tg.openTelegramLink) { tg.openTelegramLink(link); tg.close(); }
      else if (D.b) { location.href = link; }
      else { current = FRAMES.filter(function (f) { return f.key === state.pick; })[0]; render(); }
    }
  });
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor("#0E1014");
      tg.setBackgroundColor && tg.setBackgroundColor("#0E1014");
      tg.BackButton && tg.BackButton.onClick(function () { go("main"); });
    } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
