<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Time · Профіль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E1014; --card: #181B22; --line: #22262F; --line2: #1F232B; --chip: #2A2F3A;
  --text: #ECE7DC; --muted: #8D8778; --soft: #B7AE9C; --gold: #E2BE6A; --gold2: #F3D58E;
  --green: #7FC9A0; --red: #C0453A; --ink: #17130A;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Manrope, system-ui, sans-serif; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; }
.wrap { max-width: 480px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line2); min-height: 56px; }
.top h2 { margin: 0; font-size: 15px; font-weight: 700; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #9AA0AA; cursor: pointer; border-radius: 12px; }
.hero { display: flex; flex-direction: column; align-items: center; padding: 22px 16px 16px; gap: 6px; text-align: center; }
.ava-wrap { position: relative; margin-bottom: 8px; }
.ava { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ava-in { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); background: var(--chip); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; }
.ava-in { position: relative; overflow: hidden; }
.ava-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.lvl-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 2px solid var(--bg); }
h1 { margin: 6px 0 0; font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1.15; word-break: break-word; }
.sub { font-size: 13px; color: var(--soft); }
.tokens { display: flex; gap: 8px; margin-top: 6px; }
.token { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.token.rare { border-color: var(--gold); }
.xp { width: 100%; padding: 0 16px; margin-top: 4px; }
.bar { height: 8px; border-radius: 999px; background: var(--line2); overflow: hidden; }
.bar > div { height: 100%; background: var(--gold); border-radius: 999px; }
.xp-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
.actions { display: flex; gap: 8px; padding: 14px 16px 4px; }
.btn { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn:disabled { background: var(--line); color: var(--muted); border-color: var(--line); cursor: default; }
.tabs { display: flex; gap: 4px; margin: 14px 16px 0; padding: 4px; background: var(--card); border-radius: 14px; border: 1px solid var(--line); }
.tab { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; }
.tabs.four .tab { font-size: 12px; }
.split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line2); margin-top: 10px; gap: 2px; }
.split > div { height: 100%; }
.tab.on { background: var(--chip); color: var(--text); }
.section { padding: 14px 16px; }
.label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 4px 0 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 800; }
.stat span { font-size: 11px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.ach { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
.ach.rare { border-color: var(--gold); }
.ach.locked { opacity: .45; }
.ach .e { font-size: 26px; line-height: 1.1; }
.ach .n { font-size: 12px; font-weight: 700; line-height: 1.2; }
.ach .d { font-size: 10px; color: var(--muted); line-height: 1.25; }
.ach .s { font-size: 11px; font-weight: 800; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 32px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 0; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.chip.on { background: var(--chip); color: var(--text); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.li:first-child { border-top: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
.lock-note { margin: 4px 16px 20px; padding: 12px 14px; border-radius: 12px; border: 1px dashed #2E333D; display: flex; gap: 10px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.frame-btn { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.frame-btn.sel { border-color: var(--gold); }
.frame-btn.locked { opacity: .55; }
.frame-btn .n { font-size: 11px; font-weight: 700; line-height: 1.2; }
.frame-btn .t { font-size: 10px; }
.rank { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; }
.rank.me { background: #1F1B12; border-color: var(--gold); color: var(--gold); }
.rank .l { width: 52px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.demo { margin: 10px 16px 0; padding: 8px 12px; border-radius: 10px; background: #1F1B12; color: var(--gold); font-size: 12px; text-align: center; }
.bottom { position: sticky; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line2); }
.hidden { display: none !important; }
.char { border-radius: 22px; padding: 4px; }
.char svg { display: block; width: 100%; height: 100%; border-radius: 18px; }
.char-wrap { position: relative; margin-bottom: 8px; }
.flip { width: 150px; height: 180px; padding: 0; border: 0; background: none; cursor: pointer; perspective: 800px; display: block; }
.flip-in { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1); }
.flip.flipped .flip-in { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-face.back { transform: rotateY(180deg); }
.flip:active .flip-in { scale: .97; }
.flip-hint { font-size: 11px; color: var(--muted); margin-top: -2px; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } }
.witem { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; text-align: center; min-height: 44px; }
.witem.sel { border-color: var(--gold); }
.witem.locked .thumb { opacity: .45; }
.witem .thumb { width: 72px; height: 86px; border-radius: 12px; overflow: hidden; }
.witem .thumb svg { width: 100%; height: 100%; display: block; }
.witem .n { font-size: 11px; font-weight: 700; line-height: 1.2; }
.witem .t { font-size: 10px; line-height: 1.25; }
/* ---------- живий стіл ---------- */
body.night { background: #0A0D16; }
.tbl-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line2); }
.tbl-top h2 { margin: 0; font-family: 'Playfair Display', serif; font-size: 20px; }
.tbl-top .sub { font-size: 12px; }
.pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.ring { position: relative; margin: 14px auto 0; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; }
.seat .face { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; background: var(--chip); border: 3px solid var(--fr, #3A404C); box-sizing: border-box; transition: box-shadow .25s; }
.seat .nm { font-size: 11px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); }
.seat .num { position: absolute; left: -2px; top: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid #3A404C; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.seat .mic { position: absolute; right: -4px; top: calc(var(--sz, 56px) - 18px); width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid #3A404C; display: flex; align-items: center; justify-content: center; }
.seat.dead .face { background: #15181E; color: #5B616C; border-color: #22262F; box-shadow: none; }
.seat.dead .nm { color: #5B616C; text-decoration: line-through; }
/* колір рамки = рамка гравця з профілю; стан гравця — зовнішнє кільце */
.seat.me .face { box-shadow: 0 0 0 3px #5B8DEF; }
.seat.ally .face { box-shadow: 0 0 0 3px var(--red); }
.seat.won .face { box-shadow: 0 0 0 3px var(--gold, #E2BE6A), 0 0 18px rgba(226,190,106,.35); }
.result { font-family: "Playfair Display", serif; font-size: 20px; font-weight: 700; color: #E2BE6A; }
.seat.can .face { box-shadow: 0 0 0 2px rgba(226,190,106,.45); }
.seat.pick .face { box-shadow: 0 0 0 4px var(--gold), 0 0 24px rgba(226,190,106,.55); }
.seat .votes { position: absolute; right: -6px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.clock { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 50%; background: #14171D; border: 1px solid var(--line); }
.clock .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.clock .t { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
.clock .s { font-size: 11px; color: var(--muted); }
.act { margin: 12px 16px 16px; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.act .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.act .v { font-size: 16px; font-weight: 700; }
.act .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
body { transition: background-color 1.2s ease; }
.seat .face { overflow: hidden; position: relative; }
.seat .face svg { width: 100%; height: 100%; display: block; }
.seat.dead .face svg { filter: grayscale(1) brightness(.45); }
.seat .x { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 22px; font-weight: 800; }
.seat .rl { font-size: 10px; }
.seat.talk .face { box-shadow: 0 0 0 4px rgba(226,190,106,.5), 0 0 22px rgba(226,190,106,.45); animation: talk 1.1s ease-in-out infinite; }
@keyframes talk { 50% { box-shadow: 0 0 0 7px rgba(226,190,106,.18), 0 0 30px rgba(226,190,106,.6); } }
.clock .prog { position: absolute; left: 0; top: 0; transform: rotate(-90deg); }
.clock .prog circle { fill: none; stroke-width: 3; }
.clock .prog .track { stroke: #22262F; }
.clock .prog .arc { stroke: var(--gold); stroke-linecap: round; transition: stroke-dasharray .9s linear, stroke .3s; }
.clock .prog .arc.low { stroke: var(--red); }
body.night .clock { background: #0F1422; border-color: #1E2638; }
body.night .clock .prog .arc { stroke: #8FB2F5; }
body.night .clock .prog .arc.low { stroke: var(--red); }
body.night .clock .k { color: #8FB2F5; }
body.night .act, body.night .banner, body.night .log-h { background: #121829; border-color: #253048; }
.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13px; line-height: 1.35; }
.banner.death { border-color: rgba(192,69,58,.55); }
.banner.lynch { border-color: rgba(226,190,106,.55); }
.vc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 16px 0; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.vc-state { font-size: 13px; font-weight: 700; color: var(--muted); }
.vc-state.on { color: var(--green); }
.vc-go { flex: none; min-height: 44px; padding: 0 14px; font-size: 13px; }
body.night .vc-row { background: #121829; border-color: #253048; }
.talking { text-align: center; font-size: 13px; font-weight: 700; color: var(--gold); min-height: 18px; margin: 2px 16px 0; }
.role-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.peek { flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: #1E222B; color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.log { margin: 0 16px 24px; }
.log-h { width: 100%; justify-content: flex-start; padding: 0 14px; }
.log-list { padding: 4px 4px 0; }
.log .ph { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 14px 0 4px; }
.log .ev { font-size: 13px; line-height: 1.35; padding: 7px 0; border-bottom: 1px solid var(--line2); color: var(--soft); }
.log .ev.death { color: #E8A39B; }
.log .ev.lynch { color: var(--gold2); }
.log .ev.secret { color: #B5CBF8; }
.log .ph.secret { color: #8FB2F5; }
.log .dn { color: var(--muted); font-size: 11px; }
.banner.secret { border-color: rgba(91,141,239,.6); background: #131A2B; color: #DCE6FB; display: flex; flex-direction: column; gap: 2px; }
.banner .lock { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8FB2F5; font-weight: 800; }
.seat .kn { color: #8FB2F5; font-weight: 700; }
.seat.known .face { box-shadow: 0 0 0 3px rgba(91,141,239,.55); }
.phase-flash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: #EDE6D6; background: rgba(14,16,20,.55); animation: flash 1.8s ease forwards; z-index: 8; }
.phase-flash.night { background: rgba(10,13,22,.75); color: #B5CBF8; }
@keyframes flash { 0% { opacity: 0; } 20% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } .seat.talk .face { animation: none; } .clock .prog .arc { transition: none; } }
#wtoast { bottom: 96px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2A2416; border: 1px solid var(--gold); color: var(--gold2); padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: 90vw; z-index: 9; }
</style>
</head>

    if (el.dataset.tab) { state.tab = el.dataset.tab; haptic(); return render(); }
    if (el.dataset.scope) { state.scope = el.dataset.scope; haptic(); return render(); }
    if (el.dataset.filter) { state.filter = el.dataset.filter; haptic(); return render(); }
    if (el.dataset.pick) { state.pick = el.dataset.pick; haptic(); return render(); }
    if (el.id === "apply" && WAPI.length && own && !wBusy) {
      wBusy = true;
      var want = state.pick;
      botCall("/api/frame", { key: want }).then(function (res) {
        wBusy = false;
        if (res && res.ok) { D.r = want; current = FRAMES.filter(function (f) { return f.key === want; })[0] || current; haptic(); }
        render(); showToast(res ? res.text : "Немає зв'язку з ботом");
      });
      return;
    }
    if (el.id === "apply") {
      var link = "https://t.me/" + D.b + "?start=frame_" + state.pick;
      if (D.b && tg && tg.openTelegramLink) { tg.openTelegramLink(link); tg.close(); }
      else if (D.b) { location.href = link; }
      else { current = FRAMES.filter(function (f) { return f.key === state.pick; })[0]; render(); }
    }
  });
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor("#0E1014");
      tg.setBackgroundColor && tg.setBackgroundColor("#0E1014");
      tg.BackButton && tg.BackButton.onClick(function () { go("main"); });
    } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
